/* ==========================================================
   Balapan Focus & Calm — base tokens, type, paper texture
   Palette is intentionally muted (low saturation, no neon,
   no pure red) so the UI never shouts at a sensitive child.
   ========================================================== */
:root{
  --oat:#F3EBDD;
  --paper:#FBF7EF;
  --sand:#E7D7BC;
  --sand-deep:#D6C09C;
  --clay:#C98E70;
  --clay-deep:#A96C51;
  --clay-soft:#EBCDBB;
  --sage:#A3B59C;
  --sage-deep:#6F8A6E;
  --sage-soft:#DCE4D5;
  --dusty:#93A9BA;
  --dusty-deep:#5F7889;
  --dusty-soft:#D8E1E7;
  --butter:#E4CC8F;
  --butter-deep:#C7A65A;
  --rose:#D9B5A7;
  --ink:#3B3632;
  --ink-soft:#6E655D;
  --ink-faint:#9C9289;
  --line:#E2D6C3;
  --shadow-paper: 0 1px 0 rgba(90,70,50,.08), 0 6px 0 -2px rgba(150,120,90,.12), 0 14px 30px -18px rgba(70,50,30,.35);
  --shadow-soft: 0 10px 30px -18px rgba(70,50,30,.45);
  --r-s:12px; --r-m:20px; --r-l:30px;
  --f-display:"Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-body:"Nunito", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(.22,.8,.26,1);
  --ease-soft: cubic-bezier(.45,.05,.3,1);
  --maxw: 1160px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; color:var(--ink); background:var(--oat);
  font-family:var(--f-body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
/* paper grain — SVG turbulence noise as a fixed overlay */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:100;
  opacity:.38; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
/* very soft fibres */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(228,204,143,.22), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(163,181,156,.22), transparent 60%);
}
h1,h2,h3,h4{font-family:var(--f-display); font-weight:650; line-height:1.12; margin:0 0 .4em; letter-spacing:-.01em; font-variation-settings:"SOFT" 100, "WONK" 1;}
h1{font-size:clamp(2.1rem, 4.6vw, 3.6rem)}
h2{font-size:clamp(1.6rem, 3vw, 2.3rem)}
h3{font-size:1.3rem}
p{margin:0 0 1em}
a{color:var(--dusty-deep); text-underline-offset:3px; text-decoration-thickness:1.5px}
a:hover{color:var(--ink)}
button{font:inherit; color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--dusty); outline-offset:3px; border-radius:8px}
.skip{position:absolute; left:-999px; top:8px; background:var(--paper); padding:8px 12px; border-radius:8px; z-index:200}
.skip:focus{left:8px}
.sr{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 22px}
.eyebrow{font-weight:800; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--clay-deep)}
.muted{color:var(--ink-soft)}
.hand{font-family:var(--f-display); font-style:italic; font-weight:500}
.print-only{display:none}
[hidden]{display:none !important}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}}
@keyframes drift{from{transform:translateX(-30px)} to{transform:translateX(30px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.025)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)}}
@keyframes starPop{0%{transform:scale(.2) rotate(-30deg); opacity:0} 60%{transform:scale(1.15) rotate(6deg); opacity:1} 100%{transform:scale(1) rotate(0)}}
@keyframes wiggle{0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}}

.reveal{animation:rise .7s var(--ease-out) both}
.reveal.d1{animation-delay:.08s}.reveal.d2{animation-delay:.16s}.reveal.d3{animation-delay:.24s}.reveal.d4{animation-delay:.32s}.reveal.d5{animation-delay:.4s}

#app{min-height:70vh; outline:none}
.screen{animation:screenIn .55s var(--ease-out) backwards}
.screen.leaving{animation:screenOut .22s ease-in both}
@keyframes screenIn{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
@keyframes screenOut{to{opacity:0; transform:translateY(-6px)}}

/* Calm mode + OS reduced motion: almost no movement */
html.calm *, html.calm *::before, html.calm *::after{
  animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.12s !important; scroll-behavior:auto !important;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.12s !important; scroll-behavior:auto !important}
}
html.calm body::after{opacity:.5}

<style data-src="css/components.css">
/* ---------- top bar ---------- */
.topbar{position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:18px; padding:12px 22px;
  background:rgba(243,235,221,.92); backdrop-filter:saturate(1.1) blur(6px); border-bottom:1.5px dashed var(--line)}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink)}
.brand-mark{width:42px; height:42px; display:grid; place-items:center; background:var(--paper); border-radius:46% 54% 50% 50% / 55% 48% 52% 45%; box-shadow:var(--shadow-paper)}
.brand-mark svg{width:34px; height:34px}
.brand-text{display:flex; flex-direction:column; line-height:1}
.brand-text b{font-family:var(--f-display); font-size:1.35rem; font-weight:700; letter-spacing:-.01em}
.brand-text small{font-size:.72rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--clay-deep); margin-top:3px}
.mainnav{display:flex; gap:4px; margin-left:auto}
.mainnav a{padding:8px 13px; border-radius:999px; text-decoration:none; color:var(--ink-soft); font-weight:700; font-size:.95rem; position:relative}
.mainnav a:hover{color:var(--ink); background:rgba(214,192,156,.25)}
.mainnav a.on{color:var(--ink); background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--sand-deep)}
.toggles{display:flex; gap:6px}
.tgl{display:flex; align-items:center; gap:6px; border:1.5px solid var(--sand-deep); background:transparent; border-radius:999px; padding:6px 12px; cursor:pointer; font-weight:700; font-size:.85rem; color:var(--ink-soft)}
.tgl[aria-pressed="true"]{background:var(--sage-soft); border-color:var(--sage); color:var(--ink)}
.tgl-ico{display:inline-flex}
@media (max-width:900px){
  .topbar{flex-wrap:wrap; padding:10px 14px; gap:8px}
  .mainnav{order:3; width:100%; margin:0; overflow-x:auto; scrollbar-width:none}
  .mainnav a{white-space:nowrap; padding:7px 12px; font-size:.9rem}
  .toggles{margin-left:auto}
  .tgl-lbl{display:none}
  .tgl{padding:8px}
}

/* ---------- buttons ---------- */
.btn{--bg:var(--ink); --fg:var(--paper); display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:14px 24px; border-radius:999px; border:0; cursor:pointer;
  background:var(--bg); color:var(--fg); font-weight:800; font-size:1.02rem; text-decoration:none; letter-spacing:.01em;
  box-shadow:0 3px 0 rgba(0,0,0,.18); transition:transform .18s var(--ease-out), box-shadow .18s, background .2s; position:relative}
.btn:hover{transform:translateY(-2px); color:var(--fg); box-shadow:0 5px 0 rgba(0,0,0,.16)}
.btn:active{transform:translateY(1px); box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.clay{--bg:var(--clay-deep)}
.btn.sage{--bg:var(--sage-deep)}
.btn.dusty{--bg:var(--dusty-deep)}
.btn.ghost{--bg:transparent; --fg:var(--ink); box-shadow:inset 0 0 0 2px var(--sand-deep)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink-soft)}
.btn.paper{--bg:var(--paper); --fg:var(--ink); box-shadow:var(--shadow-paper)}
.btn.small{padding:9px 16px; font-size:.92rem}
.btn.big{padding:18px 30px; font-size:1.15rem}
.btn[disabled]{opacity:.45; pointer-events:none}
.linkbtn{background:none; border:0; padding:0; color:var(--dusty-deep); text-decoration:underline; cursor:pointer; font-weight:700}

/* ---------- chips / tags ---------- */
.chip{display:inline-flex; align-items:center; gap:7px; padding:4px 11px 4px 9px; border-radius:999px; font-size:.78rem; font-weight:800; letter-spacing:.02em; background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--line)}
.chip i{width:10px; height:10px; border-radius:50%; display:inline-block}
.chip-anxiety i{background:var(--dusty)}
.chip-adhd i{background:var(--sage)}
.chip-both i{background:linear-gradient(90deg, var(--dusty) 50%, var(--sage) 50%); box-shadow:0 0 0 2px var(--clay-soft)}
.chip-both{box-shadow:inset 0 0 0 1.5px var(--clay-soft); background:#F8EEE6}

/* ---------- paper surfaces ---------- */
.paper{background:var(--paper); border-radius:var(--r-m); box-shadow:var(--shadow-paper); position:relative}
.tape{position:absolute; top:-11px; left:50%; width:84px; height:22px; transform:translateX(-50%) rotate(-3deg); background:rgba(228,204,143,.55); border-left:2px dashed rgba(255,255,255,.4); border-right:2px dashed rgba(255,255,255,.4)}
.stitch{border:2px dashed var(--sand-deep); border-radius:var(--r-m)}
.blob{border-radius:56% 44% 48% 52% / 46% 54% 46% 54%}

/* ---------- forms ---------- */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px}
.field label{font-weight:800; font-size:.92rem}
.input{font:inherit; padding:14px 16px; border-radius:14px; border:2px solid var(--line); background:var(--paper); color:var(--ink); outline:none; transition:border-color .2s}
.input:focus{border-color:var(--dusty)}
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg button{border:2px solid var(--line); background:var(--paper); padding:9px 16px; border-radius:999px; font-weight:700; cursor:pointer; transition:all .18s}
.seg button[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--paper)}
.search{position:relative}
.search .ico{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-faint)}
.search input{padding-left:44px; width:100%}

/* ---------- stars ---------- */
.starrow{display:inline-flex; gap:2px; vertical-align:middle}
.pstar.on{animation:starPop .5s var(--ease-out) both}
.fly-star{position:fixed; z-index:300; pointer-events:none; animation:fly 1.2s var(--ease-out) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4); opacity:0} 25%{opacity:1; transform:translate(calc(var(--dx)*.4), calc(var(--dy)*.6)) scale(1.1)} 100%{transform:translate(var(--dx), calc(var(--dy) - 80px)) scale(.6) rotate(40deg); opacity:0}}

/* ---------- toast ---------- */
.toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%, 30px); opacity:0; pointer-events:none; z-index:400; background:var(--ink); color:var(--paper); padding:12px 20px; border-radius:16px; font-weight:700; transition:all .35s var(--ease-out); max-width:90vw; text-align:center}
.toast.show{opacity:1; transform:translate(-50%,0)}

/* ---------- footer ---------- */
.foot{margin-top:70px; padding:28px 22px 40px; border-top:1.5px dashed var(--line); text-align:center; color:var(--ink-soft); font-size:.9rem}
.foot p{max-width:820px; margin:0 auto 8px}
.foot-small{font-size:.8rem}

/* ---------- hills scene ---------- */
.hills{display:block; width:100%; height:100%}
.hills .sun{animation:floaty 9s ease-in-out infinite}
.hills .cloud{animation:drift 18s ease-in-out infinite alternate}
.hills .c2{animation-duration:24s; animation-direction:alternate-reverse}
.hills .h1,.hills .h2,.hills .h3{filter:drop-shadow(0 -2px 0 rgba(255,255,255,.35))}

/* ---------- avatar animation ---------- */
.avatar{overflow:visible}
.avatar.head-only{overflow:hidden}
.avatar.head-only .av-body{animation:none}
.avatar .av-body{animation:breathe 4.2s ease-in-out infinite; transform-origin:100px 280px}
.avatar .av-eye{transform-box:view-box; animation:blink 5.5s infinite}
.avatar .av-eye:last-of-type{animation-delay:.02s}
.avatar.pose-wave .av-arm-r{animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,55%,100%{transform:rotate(0)} 65%{transform:rotate(-150deg)} 75%{transform:rotate(-125deg)} 85%{transform:rotate(-150deg)}}
.avatar.pose-walk .av-leg-l{animation:stepL .8s ease-in-out infinite}
.avatar.pose-walk .av-leg-r{animation:stepL .8s ease-in-out infinite reverse}
.avatar.pose-walk .av-body{animation:bob .4s ease-in-out infinite alternate}
@keyframes stepL{0%,100%{transform:rotate(9deg)} 50%{transform:rotate(-9deg)}}
@keyframes bob{to{transform:translateY(-3px)}}
.avatar.pose-cheer .av-arm-l{animation:cheerL 1.2s ease-in-out infinite alternate}
.avatar.pose-cheer .av-arm-r{animation:cheerR 1.2s ease-in-out infinite alternate}
@keyframes cheerL{to{transform:rotate(140deg)}}
@keyframes cheerR{to{transform:rotate(-140deg)}}
.chick .chick-wing{animation:sway 1.6s ease-in-out infinite}
.chick{animation:floaty 3.4s ease-in-out infinite}

@keyframes draw{to{stroke-dashoffset:0}}

.promise{padding-top:110px; display:grid; grid-template-columns:1fr 1fr; gap:30px; align-items:center}
.promise-card{display:flex; gap:18px; padding:28px}
.promise-ico{color:var(--sage-deep); flex:none}
.final-cta{text-align:center}
.final-cta .fine{justify-content:center; margin-top:12px}

/* ===================== QUIZ ===================== */
.quiz{display:grid; grid-template-columns:220px 1fr; gap:40px; padding-top:40px; align-items:start; max-width:980px}
.quiz-track{position:sticky; top:100px}
.stones{display:flex; flex-direction:column; gap:14px; position:relative; padding-left:6px}
.stones::before{content:""; position:absolute; left:23px; top:10px; bottom:10px; border-left:2px dashed var(--sand-deep)}
.stone{width:36px; height:32px; display:grid; place-items:center; border-radius:50% 50% 46% 54% / 60% 60% 40% 40%; background:var(--paper); color:var(--ink-faint); font-weight:800; font-size:.85rem; position:relative; box-shadow:var(--shadow-paper)}
.stone.done{background:var(--sage); color:var(--paper)}
.stone.now{background:var(--clay); color:var(--paper); transform:scale(1.15)}
.track-chick{position:absolute; left:52px; top:calc(var(--p) * (100% - 80px)); transition:top .6s var(--ease-out)}
.track-lbl{margin-top:16px; font-weight:800; color:var(--ink-soft); font-size:.88rem}
.quiz-card{padding:36px 38px 28px; min-height:440px; display:flex; flex-direction:column}
.quiz-card.swap{animation:cardIn .45s var(--ease-out)}
@keyframes cardIn{from{opacity:0; transform:translateX(24px) rotate(.6deg)} to{opacity:1; transform:none}}
.quiz-card h2{font-size:clamp(1.6rem,3vw,2.2rem)}
.opts{display:grid; gap:12px; margin:18px 0 10px}
.opts.single{grid-template-columns:1fr 1fr}
.opts.multi{grid-template-columns:1fr 1fr}
.opts.many{grid-template-columns:repeat(2,1fr)}
.opt{display:flex; align-items:flex-start; gap:12px; text-align:left; padding:15px 16px; border-radius:16px; background:var(--oat); border:2px solid transparent; cursor:pointer; transition:all .2s var(--ease-out)}
.opt:hover{border-color:var(--sand-deep); transform:translateY(-2px)}
.opt b{display:block; font-size:1rem}
.opt small{display:block; color:var(--ink-soft); font-size:.86rem; line-height:1.35; margin-top:3px}
.opt .tick{flex:none; width:24px; height:24px; border-radius:8px; border:2px solid var(--sand-deep); display:grid; place-items:center; color:transparent; background:var(--paper); margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--ink); background:var(--paper); box-shadow:0 4px 0 rgba(0,0,0,.06)}
.opt[aria-pressed="true"] .tick{background:var(--ink); border-color:var(--ink); color:var(--paper)}
.opt-anxiety[aria-pressed="true"]{border-color:var(--dusty-deep)} .opt-anxiety[aria-pressed="true"] .tick{background:var(--dusty-deep); border-color:var(--dusty-deep)}
.opt-adhd[aria-pressed="true"]{border-color:var(--sage-deep)} .opt-adhd[aria-pressed="true"] .tick{background:var(--sage-deep); border-color:var(--sage-deep)}
.opt-both[aria-pressed="true"]{border-color:var(--clay-deep)} .opt-both[aria-pressed="true"] .tick{background:var(--clay-deep); border-color:var(--clay-deep)}
.quiz-nav{margin-top:auto; padding-top:22px; display:flex; justify-content:space-between; gap:12px}
.cheer{text-align:center; padding:20px 0}
.cheer-art{display:flex; justify-content:center; margin-bottom:8px}
.cheer .lede{margin:0 auto}

/* ===================== BUILDER ===================== */
.builder{padding-top:36px}
.b-head{max-width:720px; margin-bottom:22px}
.b-grid{display:grid; grid-template-columns:minmax(300px, 1fr) 1.15fr; gap:26px; align-items:start}
.b-stage{height:540px; overflow:hidden; display:flex; align-items:flex-end; justify-content:center; background:linear-gradient(#EDE3D2, #F6EFE3); position:sticky; top:96px}
.b-scene{position:absolute; inset:auto 0 0 0; height:46%}
.b-av{position:relative; margin-bottom:34px}
.b-av.pop{animation:popIn .4s var(--ease-out)}
@keyframes popIn{0%{transform:scale(.96)} 60%{transform:scale(1.03)} 100%{transform:scale(1)}}
.b-name{position:absolute; top:22px; left:24px; font-family:var(--f-display); font-size:1.7rem; font-weight:700; transform:rotate(-3deg)}
.b-stage-actions{position:absolute; top:18px; right:18px}
.b-panel{padding:22px 24px}
.b-tabs{display:flex; gap:6px; flex-wrap:wrap; border-bottom:2px dashed var(--line); padding-bottom:14px; margin-bottom:16px}
.b-tabs button{border:0; background:transparent; padding:9px 14px; border-radius:12px; cursor:pointer; font-weight:800; color:var(--ink-soft)}
.b-tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper)}
.b-row{margin-bottom:20px}
.b-row h4{font-family:var(--f-body); font-size:.82rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:10px}
.swatches{display:flex; flex-wrap:wrap; gap:10px}
.sw{width:44px; height:44px; border-radius:50%; border:3px solid var(--paper); background:var(--c); cursor:pointer; box-shadow:0 0 0 2px var(--line); transition:transform .15s}
.sw:hover{transform:scale(1.08)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink); transform:scale(1.1)}
.b-save{border-top:2px dashed var(--line); padding-top:18px; margin-top:6px}

/* ===================== PLAN ===================== */
.plan{padding-top:30px}
.flag-banner{display:flex; gap:16px; padding:20px 22px; margin-bottom:24px; background:#F6E9E1; color:var(--ink); border-left:6px solid var(--clay)}
.flag-banner svg{flex:none; color:var(--clay-deep)}
.plan-head{display:grid; grid-template-columns:330px 1fr; gap:34px; align-items:center}
.plan-hero{position:relative; height:300px; border-radius:var(--r-l); overflow:hidden; background:#EDE3D2}
.plan-hero .hills{position:absolute; inset:auto 0 0 0; height:60%}
.ph-kid{position:absolute; left:50%; bottom:6px; transform:translateX(-50%)}
.ph-chick{position:absolute; left:14%; bottom:22px}
.plan-meta{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.plan-meta a.chip{text-decoration:none; color:var(--ink)}
.start-here{padding-top:50px}
.stones-path{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:20px}
.stone-card{padding:26px 22px 22px; display:flex; flex-direction:column; gap:10px}
.stone-card:nth-child(2){transform:translateY(18px)}
.stone-card h3{margin:4px 0 0}
.stone-card .chip{align-self:flex-start}
.stone-card .muted{font-size:.94rem; flex:1}
.stone-n{position:absolute; top:-16px; right:18px; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--ink); color:var(--paper); font-family:var(--f-display); font-weight:700}
.sc-actions{display:flex; gap:8px; flex-wrap:wrap}
.start-here .center{margin-top:36px}
.two-col{display:grid; grid-template-columns:1fr 1.2fr; gap:22px; padding-top:40px}
.words,.habits{padding:28px}
.quote-list{list-style:none; padding:0; margin:12px 0 0; display:flex; flex-direction:column; gap:10px}
.quote-list li{font-family:var(--f-display); font-style:italic; font-size:1.12rem; line-height:1.35; padding-left:16px; border-left:3px solid var(--butter)}
.swap-list{list-style:none; padding:0; margin:12px 0 0; display:flex; flex-direction:column; gap:12px}
.swap-list li{display:grid; grid-template-columns:1fr 22px 1.1fr; gap:10px; align-items:center; font-size:.94rem}
.swap-list .drop{color:var(--ink-faint); text-decoration:line-through; text-decoration-color:rgba(169,108,81,.5)}
.swap-list .arrow{color:var(--clay)}
.swap-list .instead{font-weight:700}
.small{font-size:.88rem}
.rhythm{padding-top:44px}
.rhythm-row{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.rh{padding:20px}
.rh-ico{display:inline-grid; place-items:center; width:48px; height:48px; border-radius:50%; background:var(--oat); color:var(--clay-deep); margin-bottom:8px}
.rh b{display:block}
.rh p{margin:4px 0 0; color:var(--ink-soft); font-size:.94rem}
.empty{max-width:560px; margin:60px auto; padding:40px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px}

/* ===================== LIBRARY ===================== */
.library{padding-top:36px}
.lib-head{display:grid; grid-template-columns:1.4fr 1fr; gap:30px; align-items:end}
.lib-legend{padding:18px 20px; display:flex; flex-direction:column; gap:8px; font-size:.88rem; color:var(--ink-soft)}
.lib-legend b{color:var(--ink)}
.lib-legend span{display:flex; align-items:center; gap:8px}
.lib-tools{display:grid; grid-template-columns:auto 1fr; gap:14px 18px; align-items:center; margin:28px 0 26px}
.filter-tabs{display:flex; gap:6px; background:var(--paper); padding:5px; border-radius:999px; box-shadow:inset 0 0 0 1.5px var(--line)}
.ft{border:0; background:transparent; padding:9px 15px; border-radius:999px; font-weight:800; cursor:pointer; color:var(--ink-soft); white-space:nowrap}
.ft small{opacity:.6; font-weight:700; margin-left:3px}
.ft[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.ft-anxiety[aria-pressed="true"]{background:var(--dusty-deep)}
.ft-adhd[aria-pressed="true"]{background:var(--sage-deep)}
.ft-both[aria-pressed="true"]{background:var(--clay-deep)}
.cat-row{grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap}
.cat-row button{border:1.5px dashed var(--sand-deep); background:transparent; border-radius:999px; padding:6px 13px; font-weight:700; font-size:.88rem; cursor:pointer; color:var(--ink-soft)}
.cat-row button[aria-pressed="true"]{border-style:solid; border-color:var(--ink); color:var(--ink); background:var(--paper)}
.lib-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:30px 22px}
.sit-card{position:relative; text-align:left; border:0; cursor:pointer; padding:26px 20px 16px; background:var(--paper); border-radius:6px 6px 18px 18px; box-shadow:var(--shadow-paper); transform:rotate(var(--rot)); display:flex; flex-direction:column; gap:8px; animation:rise .5s var(--ease-out) both; transition:transform .25s var(--ease-out), box-shadow .25s}
.sit-card::after{content:""; position:absolute; left:0; right:0; top:0; height:6px; border-radius:6px 6px 0 0}
.sit-anxiety::after{background:var(--dusty)}
.sit-adhd::after{background:var(--sage)}
.sit-both::after{background:linear-gradient(90deg, var(--dusty) 0 50%, var(--sage) 50% 100%)}
.sit-card:hover{transform:rotate(0) translateY(-5px); box-shadow:0 18px 30px -18px rgba(70,50,30,.5)}
.sit-card .tape{top:-12px; width:70px}
.sit-card h3{font-size:1.2rem; margin:2px 0 0}
.sit-card p{font-size:.9rem; color:var(--ink-soft); margin:0; flex:1}
.sit-card .chip{align-self:flex-start}
.sit-ico{position:absolute; right:16px; top:20px; color:var(--sand-deep)}
.sit-foot{display:flex; justify-content:space-between; align-items:center; font-size:.8rem; font-weight:800; color:var(--ink-faint); padding-top:10px; border-top:1.5px dashed var(--line); margin-top:4px}
.sit-foot .go{display:inline-flex; align-items:center; gap:3px; color:var(--clay-deep)}
.sit-foot .has{color:var(--sage-deep); display:inline-flex; align-items:center; gap:3px}
.empty-note{text-align:center; padding:30px}

/* sheet / modal */
.sheet{position:fixed; inset:0; z-index:150; display:grid; place-items:center; padding:20px}
.sheet-bg{position:absolute; inset:0; background:rgba(59,54,50,.35); opacity:0; transition:opacity .25s}
.sheet-card{position:relative; width:min(880px, 100%); max-height:88vh; overflow:auto; padding:30px 32px; transform:translateY(30px) scale(.98); opacity:0; transition:all .3s var(--ease-out)}
.sheet-card.narrow{width:min(480px,100%)}
.sheet.open .sheet-bg{opacity:1}
.sheet.open .sheet-card{transform:none; opacity:1}
.sheet-x{position:absolute; right:14px; top:10px; width:40px; height:40px; border-radius:50%; border:0; background:var(--oat); font-size:1.6rem; line-height:1; cursor:pointer}
.sh-top{display:flex; gap:8px; margin-bottom:10px}
.sh-grid{display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:8px}
.sh-grid h4{font-family:var(--f-body); font-size:.8rem; text-transform:uppercase; letter-spacing:.12em; color:var(--clay-deep); margin:14px 0 8px}
.mini-ladder{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:8px}
.mini-ladder li{display:flex; gap:10px; align-items:flex-start; font-size:.95rem; background:var(--oat); padding:9px 12px; border-radius:12px}
.mini-ladder li span{flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--paper); font-weight:800; font-size:.8rem}
.mini-ladder small{color:var(--ink-faint)}
.sh-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:24px}
.mono{font-family:ui-monospace, Menlo, monospace; background:var(--oat); padding:10px 12px; border-radius:10px; word-break:break-all; font-size:.86rem}

/* ===================== BRAVE PLAN ===================== */
.brave,.quest{padding-top:26px}
.crumbs{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px}
.crumbs a:first-child{display:inline-flex; align-items:center; gap:4px; font-weight:800; text-decoration:none; color:var(--ink-soft); margin-right:6px}
.crumbs a.chip{text-decoration:none; color:var(--ink)}
.brave-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:24px; align-items:start; margin-top:10px}
.book{overflow:hidden; display:flex; flex-direction:column}
.book-scene{position:relative; height:290px; background:linear-gradient(#EAE2D4, #F4EDE1); overflow:hidden}
.book-scene .hills{position:absolute; inset:auto 0 0 0; height:70%}
.bk-kid{position:absolute; bottom:4px; left:8%; transition:left 1.4s var(--ease-soft)}
.bk-chick{position:absolute; bottom:10px; left:2%; transition:left 1.7s var(--ease-soft)}
.bk-prop{position:absolute; right:7%; top:28px; width:150px; height:120px; animation:rise .7s var(--ease-out)}
.bk-prop svg{width:100%; height:100%}
.prop-wave .wv{animation:floaty 3s ease-in-out infinite}
.prop-breath .bl{transform-origin:50px 50px; animation:breathBall 6s ease-in-out infinite}
@keyframes breathBall{0%,100%{transform:scale(.85)} 40%{transform:scale(1.08)}}
.book-text{padding:26px 34px 10px; min-height:150px}
.book-text p{font-family:var(--f-display); font-size:clamp(1.25rem, 2.2vw, 1.55rem); line-height:1.45; font-weight:500; margin:0}
.book-text p.in{animation:rise .5s var(--ease-out)}
.book-nav{display:flex; align-items:center; gap:10px; padding:14px 22px 20px; border-top:2px dashed var(--line); margin-top:auto}
.dots{display:flex; gap:6px; margin-right:auto; flex-wrap:wrap}
.dot{width:12px; height:12px; border-radius:50%; border:0; background:var(--sand); cursor:pointer; padding:0}
.dot.on{background:var(--clay); width:28px; border-radius:6px}
#bkRead.on{background:var(--sage-deep)}
.ladder{padding:22px 22px 18px}
.ladder-head{display:flex; justify-content:space-between; align-items:baseline}
.ladder-head h3{display:flex; gap:8px; align-items:center}
.rungs{list-style:none; padding:0 0 0 0; margin:12px 0 16px; position:relative}
.rungs::before{content:""; position:absolute; left:19px; top:6px; bottom:6px; width:4px; background:repeating-linear-gradient(var(--sand-deep) 0 8px, transparent 8px 14px)}
.rung-row{display:flex; gap:12px; padding:8px 0; position:relative}
.rung-n{flex:none; width:42px; height:42px; display:grid; place-items:center; border-radius:50%; background:var(--paper); box-shadow:inset 0 0 0 2px var(--sand-deep); font-weight:800; color:var(--ink-faint); z-index:1}
.rung-row.done .rung-n{box-shadow:none; background:transparent}
.rung-row.now .rung-n{background:var(--clay); color:var(--paper); box-shadow:0 0 0 6px var(--clay-soft)}
.rung-body p{margin:8px 0 0; font-weight:700; line-height:1.35}
.rung-row.later .rung-body p{color:var(--ink-faint); font-weight:600}
.rung-row.done .rung-body p{color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--butter-deep)}
.rung-row.mini .rung-body p{font-style:italic}
.rung-body small{color:var(--sage-deep); font-weight:800; font-size:.78rem}
.rung-actions{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:10px; padding:12px; background:var(--oat); border-radius:14px}
.practice{display:flex; flex-direction:column; font-size:.72rem; color:var(--ink-faint); font-weight:800}
.warm{width:100%; text-align:center}
.tips{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:28px}
.tip{padding:24px}
.plain{padding-left:18px; margin:10px 0 0}
.plain li{margin-bottom:8px}
.plain.two{columns:2; column-gap:30px}
.celebrate,.move,.win{position:fixed; inset:0; background:rgba(59,54,50,.35); z-index:160; display:grid; place-items:center; padding:20px; animation:fadeIn .3s}
.cel-card,.move-card,.win-card{width:min(460px,100%); text-align:center; padding:30px; animation:rise .45s var(--ease-out)}
.cel-kid,.win-kid{display:flex; justify-content:center}
.cel-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px}

/* ===================== QUEST ===================== */
.q-top{display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap}
.pebbles{display:flex; gap:8px}
.peb{width:34px; height:28px; border-radius:50% 50% 45% 55% / 60% 60% 40% 40%; background:var(--paper); box-shadow:inset 0 0 0 2px var(--sand-deep); display:grid; place-items:center}
.peb.now{background:var(--sage); box-shadow:0 0 0 5px var(--sage-soft)}
.peb.done{background:transparent; box-shadow:none}
.q-grid{display:grid; grid-template-columns:1.2fr 1fr; gap:24px; margin-top:18px; align-items:stretch}
.q-card{padding:28px 30px; display:flex; flex-direction:column; align-items:center; text-align:center}
.q-card.flip{animation:cardFlip .55s var(--ease-out)}
@keyframes cardFlip{from{opacity:0; transform:perspective(800px) rotateY(-24deg) translateX(30px)} to{opacity:1; transform:none}}
.q-ill{margin:6px 0 4px}
.q-step{font-size:clamp(1.6rem,3.2vw,2.3rem); max-width:16em}
.done-btn{margin-top:14px; border:0; cursor:pointer; width:170px; height:170px; border-radius:50%; background:var(--sage-deep); color:var(--paper); box-shadow:0 8px 0 #566F56, 0 20px 30px -16px rgba(0,0,0,.4); transition:transform .15s, box-shadow .15s; position:relative}
.done-btn::before{content:""; position:absolute; inset:-10px; border-radius:50%; border:3px dashed var(--sage); animation:spinSlow 20s linear infinite}
.done-btn:hover{transform:translateY(-3px)}
.done-btn:active{transform:translateY(6px); box-shadow:0 2px 0 #566F56}
.db-inner{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:1.5rem; font-family:var(--f-display)}
.q-timer{padding:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px}
.timer{position:relative; width:min(340px, 100%); aspect-ratio:1}
.timer svg{width:100%; height:100%; filter:drop-shadow(0 6px 0 rgba(150,120,90,.12))}
.t-read{position:absolute; left:0; right:0; bottom:22%; text-align:center; font-family:var(--f-display); font-weight:700; font-size:1.6rem; color:var(--ink); text-shadow:0 0 8px var(--paper), 0 0 4px var(--paper)}
.t-ctrl{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.q-finish{display:flex; flex-direction:column; align-items:center}
.move-stage{height:240px; display:flex; justify-content:center; align-items:flex-end}
.mv-count{font-family:var(--f-display); font-size:2.4rem; font-weight:700; color:var(--sage-deep); margin:6px 0 10px}
.mv-stretch .avatar{animation:stretchUp 2.4s ease-in-out infinite}
.mv-hop .avatar{animation:hop 1.2s ease-in-out infinite}
.mv-sway .avatar{transform-origin:50% 100%; animation:sway 2.4s ease-in-out infinite}
.mv-push .avatar{animation:wiggle 1.6s ease-in-out infinite}
@keyframes stretchUp{0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.08) translateY(-6px)}}
@keyframes hop{0%,100%{transform:translateY(0)} 40%{transform:translateY(-34px)} 60%{transform:translateY(-34px)}}

/* ===================== GAMES HUB ===================== */
.games{padding-top:36px}
.g-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:20px}
.g-stars{display:flex; gap:12px; align-items:center; padding:14px 22px}
.g-stars b{font-family:var(--f-display); font-size:2rem; display:block; line-height:1}
.g-stars small{color:var(--ink-soft); font-weight:700}
.shelf{margin-top:34px; position:relative}
.shelf-label{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; margin-bottom:6px}
.shelf-label h2{margin:0}
.shelf-label p{margin:0}
.shelf-row{display:grid; grid-template-columns:repeat(4,1fr); gap:22px; padding:16px 10px 0; position:relative; z-index:1}
.plank{height:22px; margin-top:-6px; background:linear-gradient(#D6C09C, #C8AF88); border-radius:6px; box-shadow:0 10px 18px -10px rgba(90,60,30,.5); position:relative}
.plank::after{content:""; position:absolute; left:2%; right:2%; top:5px; border-top:1.5px dashed rgba(255,255,255,.35)}
.toy{display:flex; flex-direction:column; gap:10px; text-decoration:none; color:var(--ink); transform:rotate(var(--tilt)); transition:transform .3s var(--ease-out)}

/* ---------- scenes (animated SVG engine) ---------- */
.scene{display:block; width:100%; height:auto; border-radius:inherit}
.sc-hero,.sc-prop{transform-box:fill-box; transform-origin:50% 100%}
.scene:not(.still) .sc-bob{animation:scBob 3.2s ease-in-out infinite}
.scene:not(.still) .pose-wave .av-arm-r, .scene:not(.still) .sc-wave{animation:scWave 1.8s ease-in-out infinite; transform-box:fill-box; transform-origin:20% 90%}
.scene:not(.still) .pose-walk{animation:scWalk 1.1s ease-in-out infinite}
.scene:not(.still) .pose-jump,.scene:not(.still) .pose-cheer{animation:scJump 1.4s var(--ease-soft) infinite}
.scene:not(.still) .pose-shy{animation:scShy 4s ease-in-out infinite}
.scene:not(.still) .pose-idle{animation:scBob 3.6s ease-in-out infinite}
.scene:not(.still) .sc-sway{animation:scSway 5s ease-in-out infinite; transform-origin:50% 100%}
.scene:not(.still) .sc-swing{animation:scSwing 3s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 0}
.scene:not(.still) .sc-rock{animation:scSway 3s ease-in-out infinite}
.scene:not(.still) .sc-float{animation:scFloat 6s ease-in-out infinite}
.scene:not(.still) .sc-fly{animation:scFly 14s linear infinite}
.scene:not(.still) .sc-drive{animation:scDrive 9s linear infinite}
.scene:not(.still) .sc-scroll{animation:scDrive 24s linear infinite}
.scene:not(.still) .sc-spin{animation:scSpin 6s linear infinite; transform-box:fill-box; transform-origin:50% 50%}
.scene:not(.still) .sc-spin-slow{animation:scSpin 18s linear infinite; transform-box:fill-box; transform-origin:50% 50%}
.scene:not(.still) .sc-pulse,.scene:not(.still) .fx-pulse{animation:scPulse 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%}
.scene:not(.still) .sc-glow{animation:scGlow 3s ease-in-out infinite}
.scene:not(.still) .sc-flicker{animation:scGlow 1.3s steps(3) infinite}
.scene:not(.still) .sc-flash{animation:scGlow 2s ease-in-out infinite}
.scene:not(.still) .sc-ring{animation:scRing 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 0}
.scene:not(.still) .sc-wag,.scene:not(.still) .sc-wag-body{animation:scWag .9s ease-in-out infinite; transform-box:fill-box; transform-origin:0 100%}
.scene:not(.still) .sc-flag{animation:scWag 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:0 50%}
.scene:not(.still) .sc-bounce{animation:scJump 1.2s ease-in-out infinite}
.scene:not(.still) .sc-bubble{animation:scRise 5s ease-in infinite}
.scene:not(.still) .sc-fall{animation:scFall 6s linear infinite}
.scene:not(.still) .sc-scrub,.scene:not(.still) .sc-snip{animation:scWag .6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%}
.scene:not(.still) .fx-rain{animation:fxFall 1.1s linear infinite}
.scene:not(.still) .fx-snow,.scene:not(.still) .fx-fall{animation:fxFall 7s linear infinite}
.scene:not(.still) .fx-twinkle{animation:scGlow 2.6s ease-in-out infinite}
.scene:not(.still) .fx-zzz,.scene:not(.still) .fx-rise{animation:scRise 4s ease-out infinite}
.scene:not(.still) .fx-noise{animation:scPulse .9s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%}
.scene:not(.still) .fx-wind{animation:scDrive 4s linear infinite}
.scene:not(.still) .fx-tick{animation:scSpin 4s steps(12) infinite; transform-box:fill-box; transform-origin:50% 100%}
@keyframes scBob{50%{transform:translateY(-3px)}}
@keyframes scWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
@keyframes scWalk{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes scJump{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
@keyframes scShy{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px) rotate(-2deg)}}
@keyframes scSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes scSwing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes scFloat{50%{transform:translate(8px,-4px)}}
@keyframes scFly{from{transform:translateX(-60px)}to{transform:translateX(460px)}}
@keyframes scDrive{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes scSpin{to{transform:rotate(360deg)}}
@keyframes scPulse{50%{transform:scale(1.08)}}
@keyframes scGlow{50%{opacity:.45}}
@keyframes scRing{0%,100%{transform:rotate(0)}25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}
@keyframes scWag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes scRise{0%{transform:translateY(8px); opacity:0}30%{opacity:1}100%{transform:translateY(-30px); opacity:0}}
@keyframes scFall{from{transform:translateY(-20px)}to{transform:translateY(40px)}}
@keyframes fxFall{from{transform:translateY(-40px)}to{transform:translateY(40px)}}
html.calm .scene *, html.calm .scene{animation:none !important}
@media (prefers-reduced-motion: reduce){ .scene *, .scene{animation:none !important} }

/* ==========================================================
   i18n — every UI string is written in place in both
   languages: L("English", "Русский"). The current language
   is stored in localStorage ("balapan.lang"), default EN.
   ========================================================== */
var BF = window.BF = window.BF || {};
(function(){
  var lang = "en";
  try { lang = localStorage.getItem("balapan.lang") || (/^ru/i.test(navigator.language||"") ? "ru" : "en"); } catch(e){}
  if(lang!=="en" && lang!=="ru") lang = "en";
  BF.lang = function(){ return lang; };
  BF.setLang = function(l){ lang = (l==="ru"?"ru":"en"); try{ localStorage.setItem("balapan.lang", lang); }catch(e){} document.documentElement.lang = lang; };
  /* L("en","ru") or L({en:..,ru:..}) */
  window.L = BF.L = function(en, ru){
    if(en && typeof en==="object" && !Array.isArray(en)) return lang==="ru" ? (en.ru!=null?en.ru:en.en) : en.en;
    return lang==="ru" ? (ru!=null ? ru : en) : en;
  };
  /* fill {vars} */
  BF.fmt = function(s, v){ return String(s).replace(/\{(\w+)\}/g, function(m,k){ return v && v[k]!=null ? v[k] : m; }); };
  /* Russian plural: plural(n, "звезда","звезды","звёзд") */
  BF.plural = function(n, one, few, many){
    if(lang!=="ru") return n===1 ? one : few;
    var a = Math.abs(n)%100, b = a%10;
    if(a>10 && a<20) return many; if(b>1 && b<5) return few; if(b===1) return one; return many;
  };
  BF.dateFmt = function(iso, withTime){
    if(!iso) return "";
    var d = new Date(iso.length<=10 ? iso+"T12:00:00" : iso);
    var o = { day:"numeric", month:"short" }; if(withTime){ o.hour="2-digit"; o.minute="2-digit"; }
    try { return d.toLocaleString(lang==="ru"?"ru-RU":"en-US", o); } catch(e){ return iso; }
  };
  BF.weekday = function(d){ return d.toLocaleDateString(lang==="ru"?"ru-RU":"en-US", {weekday:"short"}); };
  document.documentElement.lang = lang;
})();

 "Прощание у школы|попрощаться у школьных ворот|Для тревожного ребёнка расставание ощущается как опасность. Долгие прощания и обещания «ничего плохого не случится» обычно только усиливают тревогу.|Отрепетировать дома прощание «обнялись — дали пять — помахали»;Дойти до ворот вместе и помахать из машины;Последние 20 шагов пройти самому, пока я смотрю;Короткое прощание у ворот, каждый день одинаково;Короткое прощание три дня подряд");
S("sleepover","anxiety","social","balloon","bedroom|teddy,suitcase,friend|shy|stars|n",[5,10,10,10,10],
 "First sleepover|sleep over at a friend's house|Being away from home at night removes every familiar comfort at once. Small steps let the child build trust in their own coping.|Talk about the sleepover and pack a comfort item;Visit the friend's home in daylight;Stay for dinner, then come home;Stay until pajamas and a story;Full sleepover, with a bedtime phone call if needed",
 "Первая ночёвка у друга|переночевать у друга|Ночь вне дома забирает все привычные опоры сразу. Маленькие шаги помогают ребёнку поверить в свои силы.|Поговорить о ночёвке и положить в сумку любимую игрушку;Сходить к другу в гости днём;Остаться на ужин и вернуться домой;Остаться до пижамы и сказки;Полная ночёвка, при необходимости — звонок перед сном");
S("dentist","anxiety","health","bubbles","dentist|chair,tooth,doctor|shy|sparkle|d",[5,5,5,5,15],
 "Dentist visit|go to the dentist|Bright lights, strange sounds and someone close to your face — lots of unknowns at once. Knowing exactly what will happen shrinks the fear.|Play dentist at home with a mirror and toothbrush;Look at photos of the dentist office together;Sit in the waiting room for five minutes;Sit in the big chair and count teeth with the dentist;Full check-up with a hand-raise signal for breaks",
 "Визит к стоматологу|сходить к стоматологу|Яркая лампа, странные звуки, чужой человек близко к лицу — много неизвестного сразу. Когда ребёнок точно знает, что будет, страх уменьшается.|Поиграть дома в стоматолога с зеркальцем и щёткой;Посмотреть вместе фото кабинета;Посидеть пять минут в зоне ожидания;Сесть в большое кресло и посчитать зубы с врачом;Полный осмотр с сигналом «подними руку — пауза»");
S("haircut","anxiety","health","trail","salon|mirror,scissors,adult|shy|none|d",[2,2,5,5,15],
 "Haircut|get a haircut|Buzzing clippers, itchy hair and a cape that holds you still can feel like too much. Practice makes the sensations predictable.|Hear an electric toothbrush buzz near your ear;Wear a towel like a cape for two minutes at home;Visit the salon and watch someone else;Trim just the front with scissors;Full haircut with breaks if needed",
 "Стрижка|подстричься|Жужжащая машинка, колючие волосы и накидка, в которой нельзя шевелиться, — это может быть слишком. Тренировка делает ощущения предсказуемыми.|Послушать жужжание электрической щётки возле уха;Посидеть дома две минуты в полотенце-накидке;Сходить в парикмахерскую и посмотреть, как стригут другого;Подровнять только чёлку ножницами;Полная стрижка с перерывами, если нужно");
S("shot","anxiety","health","balloon","clinic|syringe,doctor,teddy|shy|none|d",[3,1,5,2,5],
 "Doctor shot|get a shot at the doctor|The waiting is often worse than the pinch. Honest, calm information beats surprises or “it won't hurt”.|Talk about why shots keep us healthy;Practice slow balloon breathing for 1 minute;Role-play a shot with a teddy bear;Choose a distraction: song, counting, squeezing;Get the shot and pick the reward afterwards",
 "Укол у врача|сделать прививку|Ожидание часто страшнее самого укола. Честное спокойное объяснение лучше сюрпризов и фразы «будет не больно».|Поговорить, зачем нужны прививки;Минуту потренировать медленное дыхание-шарик;Сделать «укол» плюшевому мишке;Выбрать отвлечение: песенка, счёт, сжать мячик;Сделать укол и выбрать награду после");
S("storm","anxiety","home","bubbles","living|lightning,teddy,nightlight|shy|rain|e",[1,5,5,5,10],

 "Гроза|оставаться спокойным во время грозы|Гром внезапный и громкий. Если каждый раз прятаться, мозг решает, что гроза опасна. Маленькие шаги показывают, что она проходит.|30 секунд послушать тихие звуки грома;Почитать вместе книжку про грозу;Посмотреть вместе на дождь из окна;Во время грозы 5 минут побыть в гостиной;Во время грозы играть в игру, пока она не закончится");
S("dark","anxiety","home","dots","bedroom|nightlight,door,teddy|idle|stars|n",[5,5,5,5,5],
 "Dark bedroom|sleep in a darker room|Darkness lets the imagination fill the gaps. Gradually dimming the light builds confidence without forcing it.|Flashlight tour of the room with the lights off;Sleep with the hall light on and door open;Sleep with a small night light only;Parent checks in after 5, then 10 minutes;Fall asleep with the night light and no check-ins",
 "Тёмная комната|спать в более тёмной комнате|В темноте воображение дорисовывает страшное. Постепенно приглушая свет, мы строим уверенность без давления.|Экскурсия по комнате с фонариком при выключенном свете;Спать с открытой дверью и светом в коридоре;Спать только с маленьким ночником;Родитель заглядывает через 5, потом через 10 минут;Засыпать с ночником без проверок");
S("firedrill","anxiety","school","bubbles","classroom|bell,teacher,door|walk|noise|d",[3,1,3,2,5],

S("lost","anxiety","out","memory","shop|cart,adult,crowd|walk|thought|d",[3,5,2,3,2],

S("showtell","anxiety","school","balloon","classroom|podium,kids,star|wave|none|d",[3,3,5,3,3],

S("dog","anxiety","out","bubbles","park|dog,adult,tree|shy|none|d",[3,3,5,3,5],
 "Fear of dogs|walk past a friendly dog|Dogs move fast and bark suddenly. Learning dog signals and keeping distance under the child's control builds courage.|Look at pictures of calm dogs and name their moods;Watch a dog in the park from far away;Stand 10 steps from a friendly dog on a leash;Ask the owner and pat a calm dog on the back;Walk past a dog without crossing the street",

S("bloodtest","anxiety","health","balloon","clinic|doctor,pills,chair|shy|none|d",[3,2,3,2,5],
 "Blood test|have a blood test|Needles and the sight of blood can be very scary. Honest steps and a job for the child (breathing, counting) give them control.|Talk about what a blood test is and why;Practice holding your arm still for 30 seconds;Look at a picture of the clinic room;Choose a helper: song, squeeze ball or my hand;Have the test, then a small treat",

S("vomit","anxiety","health","balloon","bathroom|toilet,pills|shy|thought|d",[2,3,3,3,5],
 "Fear of throwing up|eat normally when worried about feeling sick|Worry about being sick can make children refuse food or trips. Avoidance makes the fear grow — gentle practice shrinks it.|Talk about how bodies sometimes feel sick and get better;Name the difference between worry tummy and sick tummy;Eat a small snack on the way somewhere;Go on a short car trip after a meal;Eat a full meal at a friend's house",

S("nightmare","anxiety","home","balloon","bedroom|bed,worry,nightlight|idle|zzz|n",[3,3,3,3,5],

S("alonestairs","anxiety","home","memory","hall|stairs,door|walk|none|e",[2,2,2,3,3],
 "Going upstairs alone|go to another room alone|Being out of sight of a parent, even at home, can feel unsafe. Short trips with a timer build the habit of returning safely.|Call out to each other from two rooms;Go upstairs while I count to 10 out loud;Fetch something from upstairs and come back;Stay in your room alone for 3 minutes;Play in your room alone for 10 minutes",
 "Подняться наверх одному|сходить в другую комнату одному|Даже дома быть вне поля зрения родителя может казаться небезопасным. Короткие вылазки с таймером учат, что можно уйти и спокойно вернуться.|Перекликаться друг с другом из разных комнат;Подняться наверх, пока я вслух считаю до 10;Принести что-то сверху и вернуться;Побыть в своей комнате одному 3 минуты;Поиграть одному в комнате 10 минут");

 "New babysitter|stay home with a new babysitter|A new adult and a parent leaving at the same time is a double change. Meeting first, with you present, makes the goodbye easier.|Look at a photo of the babysitter and say their name;Babysitter visits while you are home;Play a game with the babysitter while you're in the next room;Parent goes out for 15 minutes;Parent goes out for the whole evening",

S("elevator","anxiety","out","balloon","hall|elevator,adult|shy|none|d",[2,2,2,2,3],

 "Сделать заказ самому|заказать еду в кафе|Разговор с незнакомым взрослым может заставить тревожного ребёнка шептать или прятаться. Отрепетированные слова дают готовый сценарий.|Поиграть дома в кафе и по очереди делать заказ;Заранее выбрать блюдо в меню;Трижды вслух проговорить фразу;Заказать напиток самому, пока я рядом;Заказать всю еду самому");

<script data-src="js/core/store.js">
/* ==========================================================
   Store v2 — family state in localStorage ("balapan.v2").

   ========================================================== */
var BF = window.BF = window.BF || {};
(function(){
  var KEY = "balapan.v2", OLD = "balapan.v1";

  function pad(n){ return String(n).padStart(2,"0"); }

  function uid(){ return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  function newChild(extra){
    var c = {
      id: uid(), name:"", age:7, pronoun:"they", profile:"", hard:[], fears:[], tries:[], interest:"space", motivators:[], flags:[], specialist:false,
      quizDone:false, created: dayKey(),
      avatar:{ skin:3, hair:"curly", hairColor:1, eyes:0, top:"hoodie", topColor:2, bottom:"pants", bottomColor:0, shoes:"sneakers", shoeColor:0, build:"medium", extra:"none" },
      avatarSaved:false,
      plans:{}, planOrder:[], activePlan:null,
      stars:0, starLog:[], done:[], checkins:[], days:[], games:{},
      diary:[], outcomes:[], moods:[], daily:{}, gameLevels:{},

  }
  function defaults(){
    return { v:2, children:{}, order:[], active:null, plan:"free", settings:{ calm:false, sound:false, theme:"light", voiceEn:"", voiceRu:"", rate:0.86, pitch:1.0, ttsOn:false, ttsEndpoint:"https://api.openai.com/v1/audio/speech", ttsKey:"", ttsModel:"gpt-4o-mini-tts", ttsVoice:"shimmer" }, demoCleared:false, demoSeeded:false };
  }
  function migrate(old){
    var st = defaults(); if(!old || !old.child) return st;
    var c = newChild({ name:old.child.name, age:old.child.age, pronoun:old.child.pronoun, profile:old.child.profile, hard:old.child.hard||[], tries:old.child.tries||[], interest:old.child.interest||"space", flags:old.child.flags||[],
      quizDone:!!old.quizDone, avatar:old.avatar||undefined, avatarSaved:!!old.avatarSaved, plans:old.plans||{}, planOrder:old.planOrder||[], activePlan:old.activePlan, stars:old.stars||0, starLog:old.starLog||[], done:old.done||[], checkins:old.checkins||[], days:old.days||[], games:old.games||{} });

    if(old.settings){ st.settings.calm=!!old.settings.calm; st.settings.sound=!!old.settings.sound; }

  }

  var state;

    var raw = JSON.parse(localStorage.getItem(KEY)||"null");

    else state = migrate(JSON.parse(localStorage.getItem(OLD)||"null"));
  } catch(e){ state = defaults(); }
  // repair children objects (new fields)
  Object.keys(state.children).forEach(function(id){ var base = newChild(); var c = state.children[id]; Object.keys(base).forEach(function(k){ if(c[k]===undefined) c[k]=base[k]; }); });
  state.order = state.order.filter(function(id){ return state.children[id]; });
  if(!state.active || !state.children[state.active]) state.active = state.order[0] || null;

  BF.store = {
    FREE_PLANS: FREE_PLANS, LIMITS: LIMITS,
    today: dayKey, dayKey: dayKey, uid: uid,
    get f(){ return state; },                         // family
    get s(){ return BF.store.child(); },              // active child (back-compat)
    child: function(){
      if(!state.active || !state.children[state.active]){
        var c = newChild(); state.children[c.id]=c; state.order.push(c.id); state.active=c.id; this.save();
      }

    },
    children: function(){ return state.order.map(function(id){ return state.children[id]; }).filter(Boolean); },
    realChildren: function(){ return this.children().filter(function(c){ return !c.isDemo; }); },
    childLimit: function(){ return LIMITS[state.plan]||1; },
    canAddChild: function(){ return this.realChildren().length < this.childLimit(); },
    addChild: function(extra){ var c = newChild(extra); state.children[c.id]=c; state.order.push(c.id); state.active=c.id; this.save(); return c; },
    setActive: function(id){ if(state.children[id]){ state.active=id; this.save(); } },
    removeChild: function(id){ delete state.children[id]; state.order = state.order.filter(function(x){ return x!==id; }); if(state.active===id) state.active = state.order[0]||null; this.save(); },
    save: function(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} },
    update: function(fn){ fn(this.child(), state); this.save(); },
    updateFamily: function(fn){ fn(state); this.save(); },
    reset: function(){ state = defaults(); this.save(); },
    isPaid: function(){ return state.plan!=="free"; },
    markActive: function(){ var c=this.child(), t=dayKey(); if(c.days.indexOf(t)<0) c.days.push(t); this.save(); },
    addStars: function(n, src){
      if(!n) return; var c = this.child();
      c.stars += n; c.starLog.push({date:dayKey(), n:n, src:src||""});
      if(c.activePlan && c.plans[c.activePlan]){ var p=c.plans[c.activePlan], r=p.ladder[p.current]; if(r) r.practice = Math.min(3,(r.practice||0)+n); }
      this.markActive();
    },
    plansUsed: function(){ var n=0; this.realChildren().forEach(function(c){ n += c.planOrder.length; }); return n; },
    plansLeft: function(){ if(this.isPaid() || this.child().isDemo) return Infinity; return Math.max(0, FREE_PLANS - this.plansUsed()); },
    streak: function(c){
      c = c || this.child(); var set = {}; c.days.forEach(function(d){ set[d]=1; });
      var n=0, d=new Date(); if(!set[dayKey()]) d.setDate(d.getDate()-1);
      while(set[dayKey(d)]){ n++; d.setDate(d.getDate()-1); }
      return n;
    },
    hasRedFlag: function(c){ c = c || this.child(); return (c.flags||[]).some(function(f){ return BF.RED_FLAGS.indexOf(f)>=0; }); },
    planBlocked: function(c){ c = c || this.child(); return this.hasRedFlag(c) && !c.specialistAck; },
    exportChild: function(id){ var c = state.children[id||state.active]; return JSON.stringify({ app:"balapan-focus-calm", version:2, exported:new Date().toISOString(), child:c }, null, 2); },
    importChild: function(json){
      var o = typeof json==="string" ? JSON.parse(json) : json; if(!o || !o.child || o.app!=="balapan-focus-calm") throw new Error("bad file");
      var c = newChild(); Object.keys(o.child).forEach(function(k){ c[k]=o.child[k]; }); c.id = uid(); c.imported = true; c.isDemo = false;
      state.children[c.id]=c; state.order.push(c.id); state.active=c.id; this.save(); return c;
    }
  };
})();

</script>
<script data-src="js/core/sound.js">
/* Soft Web Audio cues. Muted by default; silenced in Calm mode. */
var BF = window.BF = window.BF || {};
(function(){
  var ctx = null;
  function ac(){ if(!ctx){ var C = window.AudioContext||window.webkitAudioContext; if(!C) return null; ctx = new C(); } return ctx; }
  function tone(freq, dur, when, vol, type){
    var c = ac(); if(!c) return;
    var t = c.currentTime + (when||0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.08, t+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.05);
  }
  function on(){ var s=BF.store.f.settings; return s.sound && !s.calm; }
  BF.sound = {
    pop:function(){ if(on()) tone(520,0.18,0,0.06); },
    soft:function(){ if(on()) tone(330,0.25,0,0.05,"triangle"); },
    star:function(){ if(on()){ tone(523,0.35,0,0.06); tone(659,0.35,0.12,0.06); tone(784,0.5,0.24,0.06); } },
    done:function(){ if(on()){ tone(392,0.4,0,0.05); tone(523,0.6,0.15,0.05); } },
    chime:function(){ if(on()) tone(880,0.8,0,0.035); },
    unlock:function(){ var c=ac(); if(c && c.state==="suspended") c.resume(); }
  };
})();

</script>
<script data-src="js/core/voice.js">
/* ==========================================================
   Read-aloud voice.
   1) Optional neural TTS (OpenAI-compatible /audio/speech).
      The key is typed by the parent in Settings and stays in
      this browser's localStorage only — never in the repo.
      For production, point ttsEndpoint at your own proxy.
   2) Fallback: the most natural browser voice available,
      chosen automatically (Natural / Neural / Premium /
      Enhanced voices first), slower calm rate, sentence
      chunking so long pages don't get cut off.
   ========================================================== */
var BF = window.BF = window.BF || {};
(function(){
  var PREFER = {
    en:[/Aria.*Natural/i,/Jenny.*Natural/i,/Ava.*Natural/i,/Emma.*Natural/i,/Natural/i,/Neural/i,/Google US English/i,/Samantha/i,/Ava/i,/Allison/i,/Serena/i,/Premium|Enhanced/i,/Google UK English Female/i,/Karen|Moira|Tessa/i],
    ru:[/Svetlana.*Natural/i,/Dariya.*Natural/i,/Natural/i,/Neural/i,/Google.*(русский|Russian)/i,/Milena/i,/Katya/i,/Premium|Enhanced/i,/Irina/i,/Yuri|Pavel/i]
  };
  var current = null, audio = null, queue = [], btnRef = null, token = 0;
  function S(){ return BF.store.f.settings; }
  function voices(lang){
    if(!("speechSynthesis" in window)) return [];
    var re = lang==="ru" ? /^ru/i : /^en/i;
    return speechSynthesis.getVoices().filter(function(v){ return re.test(v.lang); });
  }
  function best(lang){
    var list = voices(lang); if(!list.length) return null;
    var saved = lang==="ru" ? S().voiceRu : S().voiceEn;
    if(saved){ var m = list.find(function(v){ return v.name===saved; }); if(m) return m; }
    var P = PREFER[lang]||PREFER.en;
    for(var i=0;i<P.length;i++){ var hit = list.find(function(v){ return P[i].test(v.name); }); if(hit) return hit; }
    return list.find(function(v){ return /US|GB/i.test(v.lang); }) || list[0];
  }
  function chunks(text){
    var parts = String(text).replace(/\s+/g," ").match(/[^.!?…»]+[.!?…»]*\s*/g) || [text], out = [], buf = "";
    parts.forEach(function(p){ if((buf+p).length > 180 && buf){ out.push(buf.trim()); buf = p; } else buf += p; });
    if(buf.trim()) out.push(buf.trim());
    return out;
  }
  function setBtn(on){ if(btnRef) btnRef.classList.toggle("on", on); if(!on) btnRef = null; }
  function stop(){
    token++; queue = [];
    if(audio){ try{ audio.pause(); }catch(e){} audio = null; }
    if("speechSynthesis" in window) try{ speechSynthesis.cancel(); }catch(e){}
    setBtn(false); current = null;
  }
  function browserSpeak(text, lang, my){
    if(!("speechSynthesis" in window)){ BF.ui.toast(BF.L("Read-aloud isn't supported in this browser.","Этот браузер не умеет читать вслух.")); setBtn(false); return; }
    queue = chunks(text);
    var v = best(lang);
    (function next(){
      if(my!==token) return;
      var t = queue.shift(); if(!t){ setBtn(false); current=null; return; }
      var u = new SpeechSynthesisUtterance(t);
      u.lang = v ? v.lang : (lang==="ru"?"ru-RU":"en-US"); if(v) u.voice = v;
      u.rate = +S().rate || 0.86; u.pitch = +S().pitch || 1;
      u.onend = function(){ setTimeout(next, 260); };   // small calm pause between sentences
      u.onerror = function(){ setBtn(false); };
      speechSynthesis.speak(u);
    })();
  }
  function neuralSpeak(text, lang, my){
    var s = S();
    return fetch(s.ttsEndpoint, { method:"POST", headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+s.ttsKey },
      body: JSON.stringify({ model:s.ttsModel||"gpt-4o-mini-tts", voice:s.ttsVoice||"shimmer", input:text, speed: Math.max(0.7, Math.min(1.1, +s.rate||0.9)),
        instructions: lang==="ru" ? "Говори тепло, медленно и спокойно, как мама читает ребёнку сказку на ночь." : "Speak warmly, slowly and calmly, like a parent reading a bedtime story to a young child." }) })
      .then(function(r){ if(!r.ok) throw new Error("tts "+r.status); return r.blob(); })
      .then(function(b){ if(my!==token) return; audio = new Audio(URL.createObjectURL(b)); audio.onended = function(){ setBtn(false); }; return audio.play(); });
  }
  function speak(text, btn, lang){
    lang = lang || BF.lang();
    if(btn && btn.classList.contains("on")){ stop(); return; }
    stop(); btnRef = btn || null; setBtn(true); current = text; var my = ++token;
    var s = S();
    if(s.ttsOn && s.ttsKey && s.ttsEndpoint){
      neuralSpeak(text, lang, my).catch(function(){ if(my!==token) return; BF.ui.toast(BF.L("Neural voice unavailable — using the browser voice.","Нейроголос недоступен — читаем голосом браузера.")); browserSpeak(text, lang, my); });
    } else browserSpeak(text, lang, my);
  }
  if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = function(){ document.dispatchEvent(new Event("bf-voices")); };
  BF.voice = { speak:speak, stop:stop, voices:voices, best:best, chunks:chunks };
})();

</script>

<script data-src="js/core/engine.js">
/* ==========================================================
   Plan engine: situation + child profile -> Brave Plan /
   Routine Quest. Plans store only language-neutral data
   (ladder steps keep {en,ru}); story and phrases are rendered
   in the current language at view time, so EN/RU switching
   works for existing plans too.

   >>> LLM PLUG-IN POINT <<<
   BF.engine.generateWithLLM() is a stub. To use a real model:
   1. Create a serverless function that holds the API key
      server-side — NEVER put keys in this repo.
   2. Set BF.config.llmEndpoint = "/.netlify/functions/story".
   3. Return JSON {story:{en:[...],ru:[...]}}. Only the situation
      description is sent — never the child's name (spec ethics).
   ========================================================== */
var BF = window.BF = window.BF || {};
BF.config = BF.config || {};
BF.config.llmEndpoint = BF.config.llmEndpoint || null;
(function(){
  function pron(p){
    if(p==="she") return {they:"she", them:"her", their:"her"};
    if(p==="he") return {they:"he", them:"him", their:"his"};
    return {they:"they", them:"them", their:"their"};
  }
  function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
  function lowerFirst(s){ return s ? s.charAt(0).toLowerCase()+s.slice(1) : s; }
  function hash(s){ var h=0; s=String(s); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
  function T(o){ return BF.L(o); }

  function ctxFor(sit, child, lang){
    lang = lang || BF.lang();
    var c = child || BF.store.s, pr = pron(c.pronoun), it = BF.INTERESTS[c.interest] || BF.INTERESTS.space;
    var name = (c.name||"").trim() || (lang==="ru" ? "Алия" : "Sam");
    var feels = BF.FEELINGS[lang] || BF.FEELINGS.en;
    var pick = function(o){ return lang==="ru" ? (o.ru||o.en) : o.en; };
    var buddy = pick(it.buddy);
    var ctx = { name:name, they:pr.they, them:pr.them, their:pr.their, They:cap(pr.they), Their:cap(pr.their),
      buddy:buddy, Buddy:cap(buddy), world:pick(it.world), power:pick(it.power), event:pick(sit.event), feel:feels[hash(name+sit.id) % feels.length], fem: c.pronoun==="she" };
    sit.steps.forEach(function(s,i){ ctx["step"+(i+1)] = lowerFirst(pick(s)); });
    return ctx;
  }
  function fill(tpl, ctx){
    var out = tpl.replace(/\{g:([^|}]*)\|([^}]*)\}/g, function(m,a,b){ return ctx.fem ? b : a; })
                 .replace(/\{(\w+)\}/g, function(m,k){ return ctx[k]!=null ? ctx[k] : m; });
    if(ctx.they==="they") out = out.replace(/\bthey has\b/g,"they have").replace(/\bThey has\b/g,"They have").replace(/\bthey was\b/g,"they were");
    return out;
  }
  function story(sit, child, lang){
    lang = lang || BF.lang(); var ctx = ctxFor(sit, child, lang), S = BF.STORY[lang] || BF.STORY.en;
    var pages = [ fill(S.open[hash(sit.id) % S.open.length], ctx) ];
    S[sit.tag].forEach(function(t){ pages.push(fill(t, ctx)); });
    pages.push(fill(S.close, ctx));
    return pages;
  }
  /* "acceptance + confidence" phrases: 3 lines picked per situation */
  function phrases(sit){
    var P = BF.PHRASES[sit.tag] || BF.PHRASES.both, h = hash(sit.id);
    var a1 = P.accept[h % P.accept.length], c1 = P.confident[(h>>3) % P.confident.length];
    var a2 = P.accept[(h+2) % P.accept.length], c2 = P.confident[((h>>3)+3) % P.confident.length];
    return [ T(a1)+" "+T(c1), T(a2), T(c2) ];
  }
  function habitsFor(child){
    var tries = (child||BF.store.s).tries || [];
    var list = tries.map(function(k){ return BF.HABITS[k]; }).filter(Boolean);
    if(!list.length) list = [BF.HABITS.reassure, BF.HABITS.repeat];
    return list.slice(0,3);
  }
  function buildPlan(sit, child){
    return { id:sit.id, tag:sit.tag, created:BF.store.today(), current:0, game:sit.game, source:"template",
      ladder: sit.steps.map(function(s, i){ return { text:{en:s.en, ru:s.ru}, min:sit.mins[i]||3, done:false, date:null, practice:0 }; }) };
  }
  function splitStep(step){
    var t = step.text;
    return [
      { text:{ en:"Mini step: just the first part of “"+t.en.replace(/\.$/,"")+"” — for one minute, with you right beside them", ru:"Мини-шаг: только начало шага «"+t.ru.replace(/\.$/,"")+"» — одну минуту, вы рядом" }, min:Math.max(1, Math.round(step.min/2)), done:false, date:null, practice:0, mini:true },
      { text:t, min:step.min, done:false, date:null, practice:0 }
    ];
  }
  function generateWithLLM(sit, child){
    if(!BF.config.llmEndpoint) return Promise.resolve(null);
    var body = { system:"Write short, warm, non-clinical stories for kids 5-10, child is the hero, placeholder {name}. No medical claims. Return JSON {story:{en:[7],ru:[7]}}.",
      child:{ age:child.age, interest:child.interest, profile:child.profile }, situation:{ title:sit.title, tag:sit.tag, steps:sit.steps } };
    return fetch(BF.config.llmEndpoint, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(!j || !j.story) return null; var b = buildPlan(sit, child); b.llmStory = j.story; b.source="llm"; return b; })
      .catch(function(){ return null; });
  }
  function generate(sit, child){ child = child || BF.store.s; return generateWithLLM(sit, child).then(function(p){ return p || buildPlan(sit, child); }); }
  function planStory(plan, sit, child){
    if(plan && plan.llmStory){ var pages = plan.llmStory[BF.lang()] || plan.llmStory.en; var nm = ((child||BF.store.s).name||"").trim()||"Sam"; return pages.map(function(p){ return p.replace(/\{name\}/g, nm); }); }
    return story(sit, child);
  }

  /* Quiz answers -> starting situations */
  var HARD_MAP = { mornings:["morning","dressed","pack"], homework:["homework","test","worksheet"], bedtime:["bedtime","dark","separationnight"], fears:["storm","dog","nightmare"],
    transitions:["switch","screens","parkleave"], noise:["cafeteria","party","dryer"], losing:["losing","mistakes","tryout"], screens:["screens","sleepwind"] };
  var FEAR_MAP = { separation:["dropoff","babysitter"], sleepover:["sleepover","grandma"], doctors:["dentist","shot","bloodtest"], tests:["test","mistakes"], dark:["dark","storm","monsters"],
    loud:["dryer","firedrill","cinema"], "new":["newplace","clubnew","kindergarten"], speaking:["showtell","presentation","askhelp"] };
  function find(id){ return BF.SITUATIONS.find(function(s){ return s.id===id; }); }
  function recommend(child, n){
    child = child || BF.store.s; n = n||3;
    var prof = (child.profile==="unsure"||!child.profile) ? null : child.profile, picks = [];
    function add(id){ if(picks.indexOf(id)<0 && find(id)) picks.push(id); }
    // adaptive: situations where the last outcome was hard come first
    adaptive(child).forEach(function(a){ if(a.kind!=="next") add(a.sit); });
    (child.hard||[]).forEach(function(h){ (HARD_MAP[h]||[]).forEach(add); });
    (child.fears||[]).forEach(function(f){ (FEAR_MAP[f]||[]).forEach(add); });
    var list = picks.map(find);
    if(prof) list.sort(function(a,b){ return (b.tag===prof||b.tag==="both") - (a.tag===prof||a.tag==="both"); });
    BF.SITUATIONS.forEach(function(s){ if(list.length<n && list.indexOf(s)<0 && (!prof || s.tag===prof)) list.push(s); });
    return list.slice(0,n);
  }
  /* Outcome log -> next-step suggestions (bilingual) */

<script data-src="js/core/charts.js">
/* Tiny SVG charts (no libraries). All return SVG strings.

var BF = window.BF = window.BF || {};
(function(){
  var COL = { sage:"#8FA487", clay:"#C98E70", dusty:"#93A9BA", sand:"#D9BC78", rose:"#D9B5A7", ink:"currentColor" };
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function frame(w,h,inner,label){ return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label||"")+'" preserveAspectRatio="xMidYMid meet">'+inner+'</svg>'; }

  }

  }

    var bw = Math.max(4, (x1-x0)/n*0.55), s = "";

    for(var i=0;i<=4;i++){ var v = o.lMin+(o.lMax-o.lMin)*i/4, y = y1-(y1-y0)*i/4; s += '<text x="'+(x1+6)+'" y="'+(y+4)+'" class="ch-lbl">'+(Math.round(v*10)/10)+'</text>'; }

  }
  function scatter(o){
    var W=o.w||320, H=o.h||220, x0=40, x1=W-14, y0=14, y1=H-30, s = gridY(o.yMin, o.yMax, 4, x0, x1, y0, y1);

    var p = []; xs.forEach(function(x,i){ if(x!=null && ys[i]!=null) p.push([x,ys[i]]); }); if(p.length<3) return null;

  }

})();

<script data-src="js/core/router.js">
/* Tiny hash router: #/route/param?x=y — works from file:// too. */
var BF = window.BF = window.BF || {};
(function(){
  var current = null, cleanup = null, gen = 0;
  BF.screens = BF.screens || {};
  var NAV = { home:"home", plan:"home", quiz:"home", hero:"home", library:"library", brave:"library", quest:"library", games:"games", game:"games", diary:"diary", specialist:"specialist", family:"home", settings:"settings", pricing:"pricing" };
  function parse(){
    var h = location.hash.replace(/^#\/?/,"");
    var parts = h.split("?")[0].split("/").filter(Boolean);
    var q = {}; (h.split("?")[1]||"").split("&").forEach(function(kv){ if(!kv) return; var p=kv.split("="); q[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||""); });
    return { name: parts[0]||"home", param: parts[1]||null, query:q };
  }
  function render(){
    var r = parse(), app = document.getElementById("app"), my = ++gen;
    var scr = BF.screens[r.name] || BF.screens.home;
    if(typeof cleanup === "function"){ try{ cleanup(); }catch(e){} cleanup = null; }
    if(BF.voice) BF.voice.stop(); document.querySelectorAll(".sheet").forEach(function(x){ x.remove(); });
    var old = app.firstElementChild;
    function swap(){
      if(my !== gen) return; // a newer navigation started during the leave animation: drop this one (no leaked game listeners/timers)
      if(typeof cleanup === "function"){ try{ cleanup(); }catch(e){} cleanup = null; }
      app.innerHTML = "";
      var el = document.createElement("section");
      el.className = "screen screen-"+r.name;
      app.appendChild(el);
      document.body.setAttribute("data-route", r.name);
      cleanup = scr.render(el, r.param, r.query) || null;
      var nav = NAV[r.name] || r.name;
      document.querySelectorAll("[data-nav]").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-nav")===nav); });
      window.scrollTo(0,0);
      var t = typeof scr.title==="function" ? scr.title(r.param) : scr.title; t = !t ? "" : (typeof t==="string" ? t : BF.L(t));
      document.title = (t ? t+" · " : "") + "Balapan Focus & Calm";
      app.focus({preventScroll:true});
    }
    if(old && current){ old.classList.add("leaving"); setTimeout(swap, document.documentElement.classList.contains("calm")?0:160); }
    else swap();
    current = r;
  }
  BF.router = {
    go:function(path){ if(location.hash === "#"+path) render(); else location.hash = path; },
    start:function(){
      window.addEventListener("hashchange", render);
      // A link to the screen you are already on (hash unchanged => no hashchange) re-opens it from the top
      // instead of doing nothing: header/tab bar tabs, diary tabs, "back" links, etc.
      document.addEventListener("click", function(e){
        if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var a = e.target.closest && e.target.closest('a[href^="#"]'); if(!a) return;
        var h = a.getAttribute("href"), cur = location.hash || "#/";
        if(h === "#" || h === "#app") return;
        if(h === cur || (h === "#/" && (cur === "#" || cur === "#/"))){ e.preventDefault(); render(); }
      });
      render();
    },
    refresh:render,
    current:function(){ return current; }
  };
})();

</script>

        '<path class="h1" d="M0 230 C140 205 260 222 400 214 C540 206 650 226 800 212 V260 H0Z" fill="#E7D7BC"/></svg>';
    },

    heroName:function(c){ c = c || BF.store.s; return (c.name||"").trim() || BF.L("Hero","Герой"); },
    /* option label lookup from a list of {v,t} */
    lbl:function(list, v){ var o = (list||[]).find(function(x){ return x.v===v; }); return o ? T(o.t) : v; },
    sheet:function(html, cls){
      var wrap = document.createElement("div"); wrap.className = "sheet"; wrap.innerHTML = '<div class="sheet-bg" data-close></div><div class="sheet-card paper '+(cls||"")+'" role="dialog" aria-modal="true"><button class="sheet-x" data-close aria-label="'+BF.L("Close","Закрыть")+'">×</button><div class="sheet-body">'+html+'</div></div>';
