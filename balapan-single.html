<script data-src="js/screens/quiz.js">
/* Parent quiz — 7 steps (spec): child → hardest → fears → what you do
   when scared → interests → motivators (+safety check) → family plan.
   BF.quiz.mount(el, {embedded}) is used both on the first-run home
   screen and on #/quiz (retake / add a child). */
var BF = window.BF = window.BF || {};
BF.screens = BF.screens || {};
BF.quiz = {
  mount:function(host, opts){
    opts = opts || {};
    var Q = BF.QUIZ, i = 0, c = BF.store.s, esc = BF.ui.esc, I = BF.icon, T = BF.ui.T;
    var total = Q.length + 1;   // + the family plan screen
    host.innerHTML = '<div class="quiz-track" id="qTrack"></div><div class="quiz-card paper" id="qCard"></div>';
    var card = host.querySelector("#qCard"), track = host.querySelector("#qTrack");
    function drawTrack(){
      var n = i+1, stones = "";
      for(var k=1;k<=total;k++) stones += '<span class="stone '+(k<n?'done':k===n?'now':'')+'">'+(k<n?I('check',14):k===total?I('star',14):k)+'</span>';
      track.innerHTML = '<div class="stones">'+stones+'</div><div class="track-chick" style="--p:'+((n-1)/(total-1))+'">'+BF.avatar.chick(46)+'</div><p class="track-lbl">'+BF.L("Step "+n+" of "+total,"Шаг "+n+" из "+total)+'</p>';
    }
    function canNext(q){
      if(q.kind==="child") return (c.name||"").trim().length>0;
      if(q.kind==="single") return !!c[q.id];
      if(q.kind==="multi") return (c[q.id]||[]).length>0 && (!q.profile || !!c.profile);
      return true;
    }
    function optBtns(list, val, multi, key){
      return '<div class="opts '+(multi?'multi':'single')+' '+(list.length>6?'many':'')+'" data-key="'+key+'">'+list.map(function(o){
        var on = multi ? (val||[]).indexOf(o.v)>=0 : val===o.v;
        return '<button type="button" class="opt opt-'+o.v+'" data-v="'+o.v+'" aria-pressed="'+on+'"><span class="tick">'+I('check',14)+'</span><span><b>'+T(o.t)+'</b></span></button>';
      }).join("")+'</div>';
    }
    function draw(){
      var q = Q[i]; drawTrack();
      var h = '<p class="eyebrow">'+BF.L("Question "+(i+1),"Вопрос "+(i+1))+'</p><h2>'+T(q.title)+'</h2><p class="muted">'+T(q.sub)+'</p>';
      if(q.kind==="child"){
        h += '<div class="field"><label for="qName">'+BF.L("Child's first name or nickname","Имя ребёнка или домашнее прозвище")+'</label><input id="qName" class="input" maxlength="20" autocomplete="off" placeholder="'+BF.L("e.g. Maya","например, Айша")+'" value="'+esc(c.name)+'"></div>'+
          '<div class="field"><label>'+BF.L("Age","Возраст")+'</label><div class="seg" data-k="age">'+[4,5,6,7,8,9,10,11].map(function(a){return '<button type="button" data-v="'+a+'" aria-pressed="'+(c.age==a)+'">'+a+'</button>';}).join("")+'</div></div>'+
          '<div class="field"><label>'+BF.L("In stories, call them","В историях говорить о ребёнке")+'</label><div class="seg" data-k="pronoun">'+[["he",BF.L("he / him","он")],["she",BF.L("she / her","она")],["they",BF.L("they / them","нейтрально")]].map(function(p){return '<button type="button" data-v="'+p[0]+'" aria-pressed="'+(c.pronoun===p[0])+'">'+p[1]+'</button>';}).join("")+'</div></div>';
      } else {
        h += optBtns(q.options, c[q.id], q.kind==="multi", q.id);
        if(q.profile) h += '<div class="field profile-q"><label>'+BF.L("How would you describe it overall? (no diagnosis needed)","Как бы вы описали это в целом? (диагноз не нужен)")+'</label>'+optBtns(BF.PROFILE_OPTS, c.profile, false, "profile")+'</div>';
        if(q.safety) h += '<div class="safety-q"><h3>'+I('shield',18)+' '+BF.L("Safety check — tick anything that's true lately","Проверка безопасности — отметьте, если это было в последнее время")+'</h3>'+optBtns(BF.FLAGS, c.flags, true, "flags")+'<p class="fine">'+BF.L("If any of these are true, we won't build a plan yet — we'll show how to reach a specialist first.","Если что-то из этого есть, мы не будем строить план — сначала подскажем, как обратиться к специалисту.")+'</p></div>';
      }
      h += '<div class="quiz-nav">'+(i>0?'<button class="btn ghost" id="qBack">'+I('back',18)+' '+BF.L("Back","Назад")+'</button>':'<span></span>')+
           '<button class="btn clay" id="qNext">'+(i===Q.length-1?BF.L("See our family plan","Открыть план для семьи"):BF.L("Continue","Дальше"))+' '+I('next',18)+'</button></div>';
      card.classList.remove("swap"); void card.offsetWidth; card.classList.add("swap");
      card.innerHTML = h;
      if(!opts.embedded || i>0) host.scrollIntoView({block:"start"});
      bind(q);
    }
    function refreshNext(q){ var b = card.querySelector("#qNext"); if(b) b.disabled = !canNext(q); }
    function bind(q){
      var name = card.querySelector("#qName");
      if(name){ name.addEventListener("input", function(){ c.name = name.value; BF.store.save(); refreshNext(q); }); if(!opts.embedded) setTimeout(function(){ name.focus(); }, 50); }
      card.querySelectorAll(".seg").forEach(function(seg){
        seg.addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; var k=seg.getAttribute("data-k");
          c[k] = k==="age" ? +b.getAttribute("data-v") : b.getAttribute("data-v");
          seg.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", x===b); }); BF.store.save(); });
      });
      card.querySelectorAll(".opts").forEach(function(box){
        var key = box.getAttribute("data-key"), multi = box.classList.contains("multi");
        var list = key==="profile" ? BF.PROFILE_OPTS : key==="flags" ? BF.FLAGS : q.options;
        box.addEventListener("click", function(e){
          var b = e.target.closest(".opt"); if(!b) return; var v = b.getAttribute("data-v");
          if(!multi){ c[key]=v; box.querySelectorAll(".opt").forEach(function(x){ x.setAttribute("aria-pressed", x===b); }); }
          else {
            var arr = (c[key]||[]).slice(), opt = list.find(function(o){ return o.v===v; }), ix = arr.indexOf(v);
            if(ix>=0) arr.splice(ix,1); else { if(opt.exclusive) arr=[]; else arr = arr.filter(function(x){ var o=list.find(function(oo){return oo.v===x;}); return !(o&&o.exclusive); }); arr.push(v); }
            c[key]=arr; box.querySelectorAll(".opt").forEach(function(x){ x.setAttribute("aria-pressed", arr.indexOf(x.getAttribute("data-v"))>=0); });
          }
          BF.sound.pop(); BF.store.save(); refreshNext(q);
        });
      });
      var back = card.querySelector("#qBack"); if(back) back.onclick = function(){ i--; draw(); };
      card.querySelector("#qNext").onclick = function(){ if(!canNext(q)) return; if(i < Q.length-1){ i++; draw(); } else finish(); };
      refreshNext(q);
    }
    function finish(){
      BF.store.update(function(ch){ ch.quizDone = true; if(!ch.profile) ch.profile="unsure"; });
      BF.store.markActive(); BF.renderShell();
      if(BF.store.hasRedFlag()) BF.router.go("/safety?from=quiz");
      else BF.router.go(BF.store.s.avatarSaved ? "/plan" : "/hero?from=quiz");
    }
    draw();
  }
};
BF.screens.quiz = {
  title:{en:"Parent quiz",ru:"Квиз для родителя"},
  render:function(el, p, query){
    var isNew = query && query.new;
    el.innerHTML = '<div class="quiz wrap"><div class="quiz-intro"><p class="eyebrow">'+(isNew?BF.L("New child","Новый ребёнок"):BF.L("Edit answers","Изменить ответы"))+'</p><h1>'+(isNew?BF.L("Let's get to know your child","Давайте познакомимся с вашим ребёнком"):BF.L("Retake the parent quiz","Пройти квиз заново"))+'</h1></div><div id="quizHost"></div></div>';
    BF.quiz.mount(el.querySelector("#quizHost"), {});
  }
};

</script>

<script data-src="js/screens/library.js">
var BF = window.BF = window.BF || {};
BF.screens.library = {
  title:{en:"Situation library",ru:"Библиотека ситуаций"},
  render:function(el, param, query){

      '</div>';
    var grid = el.querySelector("#libGrid"), more = el.querySelector("#libMore");
    function hay(s){ return [s.title.en,s.title.ru,s.why.en,s.why.ru,s.event.en,s.event.ru].concat(s.steps.map(function(x){ return x.en+" "+x.ru; })).join(" ").toLowerCase(); }
    function card(s, ix){
      var rot = ((s.id.charCodeAt(0)+s.id.length*7)%5-2)*0.5, has = !!c.plans[s.id];
      return '<button class="sit-card sit-'+s.tag+'" data-id="'+s.id+'" style="--rot:'+rot+'deg; animation-delay:'+((ix%BATCH)*30)+'ms">'+

        '<span class="sit-foot">'+(has?'<span class="has">'+I('check',14)+' '+BF.L("plan made","план создан")+'</span>':'<span>'+T(BF.CATS[s.cat])+'</span>')+'<span class="go">'+BF.L("Open","Открыть")+' '+I('next',14)+'</span></span></button>';
    }
    function appendBatch(){
      var next = list.slice(shown, shown+BATCH); if(!next.length) return;
      grid.insertAdjacentHTML("beforeend", next.map(function(s,i){ return card(s, shown+i); }).join(""));
      shown += next.length; more.hidden = shown >= list.length;
    }
    function draw(){
      var ql = q.toLowerCase().trim();
      list = ALL.filter(function(s){ return (tag==="all"||s.tag===tag) && (cat==="all"||s.cat===cat) && (!ql || hay(s).indexOf(ql)>=0); });
      grid.innerHTML = ""; shown = 0; appendBatch();
      el.querySelector("#libEmpty").hidden = list.length>0;
      el.querySelector("#libCount").textContent = BF.L("Showing "+list.length+" of "+ALL.length, "Показано "+list.length+" из "+ALL.length);
    }
    if("IntersectionObserver" in window){ io = new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting) appendBatch(); }); }, {rootMargin:"600px"}); io.observe(more); }
    else more.innerHTML = '<button class="btn ghost">'+BF.L("Show more","Показать ещё")+'</button>', more.onclick = appendBatch;
    el.querySelector(".filter-tabs").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; tag=b.getAttribute("data-tag"); el.querySelectorAll(".filter-tabs button").forEach(function(x){ x.setAttribute("aria-pressed",x===b); }); draw(); });
    el.querySelector(".cat-row").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; cat=b.getAttribute("data-cat"); el.querySelectorAll(".cat-row button").forEach(function(x){ x.setAttribute("aria-pressed",x===b); }); draw(); });

  openSheet:function(id){

      '<div class="sh-grid"><div><h4>'+BF.L("Why it's hard","Почему это трудно")+'</h4><p>'+T(s.why)+'</p><h4>'+BF.L("Try saying","Попробуйте сказать")+'</h4><ul class="quote-list">'+BF.engine.phrases(s).map(function(p){ return '<li>“'+esc(p)+'”</li>'; }).join("")+'</ul></div>'+
      '<div><h4>'+ladderTitle+'</h4><ol class="mini-ladder">'+s.steps.map(function(t,i){ return '<li><span>'+(i+1)+'</span><div>'+T(t)+(s.tag!=="anxiety"?' <small>· '+s.mins[i]+'&nbsp;'+BF.L("min","мин")+'</small>':'')+'</div></li>'; }).join("")+'</ol></div></div>'+
      '<div class="sh-actions">'+(blocked?'<a class="btn clay" href="#/safety?from=plan">'+I('heart',18)+' '+BF.L("Talk to a specialist first","Сначала к специалисту")+'</a>':
        (s.tag!=="adhd"?'<button class="btn clay" data-mode="brave">'+I('book',18)+' '+(has?BF.L("Open","Открыть"):BF.L("Make","Создать"))+' Brave Plan</button>':'')+

    sh.querySelectorAll("[data-mode]").forEach(function(b){ b.onclick = function(){ sh.close(); BF.plans.open(id, b.getAttribute("data-mode")); }; });

</script>
<script data-src="js/screens/brave.js">

BF.screens.brave = {
  title:{en:"Brave Plan",ru:"Смелый план"},

        '<div class="brave-grid">'+
          '<div class="book paper">'+
            '<div class="book-scene" id="bkScene"></div>'+
            '<div class="book-text"><p id="bkText"></p></div>'+
            '<div class="book-nav"><button class="btn small ghost" id="bkPrev" aria-label="'+BF.L("Previous page","Предыдущая страница")+'">'+I('back',18)+'</button><div class="dots" id="bkDots"></div>'+
              '<button class="btn small dusty" id="bkRead">'+I('speaker',18)+' '+BF.L("Read aloud","Читать вслух")+'</button><button class="btn small clay" id="bkNext" aria-label="'+BF.L("Next page","Следующая страница")+'">'+I('next',18)+'</button></div>'+
          '</div>'+
          '<aside class="ladder-col">'+
            '<div class="ladder paper"><div class="ladder-head"><h3>'+I('ladder',20)+' '+BF.L("Brave ladder","Лесенка смелости")+'</h3><span class="muted small" id="ldProg"></span></div><ol class="rungs" id="rungs"></ol>'+
            (game?'<a class="btn small sage warm" href="#/game/'+plan.game+'?plan='+id+'">'+I('hand',16)+' '+BF.L("Warm up with “"+T(game.title)+"” — earn practice stars","Разминка «"+T(game.title)+"» — звёзды за тренировку")+'</a>':'')+
            '<a class="btn small ghost warm" href="#/diary?tab=outcomes&add=1&sit='+id+'">'+I('target',16)+' '+BF.L("Log how the real moment went","Записать, как прошло на самом деле")+'</a></div>'+
          '</aside>'+

          '<div class="tip paper"><h3>'+BF.L("Gently drop","Мягко откажитесь")+'</h3><ul class="swap-list">'+BF.engine.habitsFor(c).map(function(h){ return '<li><span class="drop">'+T(h.drop)+'</span><span class="arrow">'+I('next',16)+'</span><span class="instead">'+T(h.instead)+'</span></li>'; }).join("")+'</ul></div>'+

        '</section>'+
      '</div>'+
      '<div class="celebrate" id="celebrate" hidden><div class="cel-card paper"><div class="cel-kid">'+A.svg(c.avatar,{size:170,pose:"cheer"})+'</div><h2>'+BF.L("The whole ladder — done!","Вся лесенка пройдена!")+'</h2><p>'+BF.L(hero+" climbed every step. That's real courage, not luck.","Каждая ступенька пройдена. Это настоящая смелость, а не везение.")+'</p><div class="cel-actions"><a class="btn clay" href="#/library">'+BF.L("Pick a new situation","Выбрать новую ситуацию")+'</a><button class="btn ghost" id="celClose">'+BF.L("Stay here","Остаться")+'</button></div></div></div>';

    function drawPage(){

      t.classList.remove("in"); void t.offsetWidth; t.classList.add("in");
      t.textContent = pages[page];
      var pose = POSES[Math.min(page, POSES.length-1)], fx = page===1 && plan.tag!=="adhd" ? "thought" : (page===n-1 ? "confetti" : parts.fx);

    if(!plan || !sit){ el.innerHTML = '<div class="wrap empty paper"><h2>'+BF.L("Pick a routine first","Сначала выберите рутину")+'</h2><p class="muted">'+BF.L("Routine Quests come from the library — mornings, homework, bedtime and more.","Квесты-рутины — в библиотеке: утро, домашка, отбой и другое.")+'</p><a class="btn sage" href="#/library?tag=adhd">'+BF.L("Open focus situations","Ситуации про внимание")+'</a></div>'; return; }
    st.update(function(x){ x.activePlan = id; });
    var steps = plan.ladder.map(function(r){ return {text:T(r.text), min:r.min}; });
    var i = 0, total = steps[0].min*60000, remain = total, running = false, last = 0, raf = 0, breakTimer = 0, earned = 0, chimed = false;
    var hero = esc(BF.ui.heroName());
    el.innerHTML =
      '<div class="quest wrap">'+
        '<div class="crumbs"><a href="#/library">'+I('back',16)+' '+BF.L("Library","Библиотека")+'</a>'+BF.ui.tagChip(plan.tag)+(plan.tag!=="adhd"?'<a class="chip" href="#/brave/'+id+'">'+I('book',14)+' '+BF.L("Brave Plan &amp; story","Смелый план и история")+'</a>':'')+'</div>'+
        '<div class="q-top"><h1>'+BF.L(hero+"'s quest: "+T(sit.title).toLowerCase(),"Квест: "+T(sit.title).toLowerCase())+'</h1><div class="pebbles" id="qPeb"></div></div>'+
        '<div class="q-grid">'+
          '<div class="q-card paper" id="qCard"></div>'+
          '<div class="q-timer paper"><div class="timer" id="qTimer"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="#FBF7EF" stroke="#E2D6C3" stroke-width="3"/>'+
            Array.from({length:12}).map(function(_,k){ var a=k*30*Math.PI/180; return '<line x1="'+(100+Math.sin(a)*80)+'" y1="'+(100-Math.cos(a)*80)+'" x2="'+(100+Math.sin(a)*88)+'" y2="'+(100-Math.cos(a)*88)+'" stroke="#D6C09C" stroke-width="3" stroke-linecap="round"/>'; }).join("")+
            '<path id="qWedge" fill="#A3B59C"/><circle cx="100" cy="100" r="12" fill="#3B3632"/></svg><div class="t-read" id="qRead"></div></div>'+
            '<div class="t-ctrl"><button class="btn small dusty" id="qPlay"></button><button class="btn small ghost" id="qMore">'+BF.L("+1 min","+1 мин")+'</button><button class="btn small ghost" id="qWiggle">'+BF.L("Wiggle break","Минутка движения")+'</button><button class="btn small ghost" id="qSay">'+I('speaker',16)+'</button></div></div>'+
        '</div>'+
      '</div>'+
      '<div class="move" id="qMove" hidden><div class="move-card paper"><p class="eyebrow">'+BF.L("60-second movement break","Минута движения")+'</p><h2 id="mvT"></h2><p id="mvD"></p><div class="move-stage"><div class="mv-kid" id="mvKid">'+A.svg(c.avatar,{size:150,pose:"cheer"})+'</div></div><div class="mv-count"><span id="mvN">60</span>'+BF.L("s","с")+'</div><button class="btn clay" id="mvDone">'+BF.L("Back to the quest","Вернуться к квесту")+'</button></div></div>';
    var card = el.querySelector("#qCard"), wedge = el.querySelector("#qWedge"), read = el.querySelector("#qRead"), playB = el.querySelector("#qPlay");
    function wedgePath(frac){
      if(frac<=0) return "";
      if(frac>=0.9999) return "M100 100 m-78 0 a78 78 0 1 0 156 0 a78 78 0 1 0 -156 0";
      var a = frac*2*Math.PI, x = 100+Math.sin(a)*78, y = 100-Math.cos(a)*78;
      return "M100 100 L100 22 A78 78 0 "+(frac>0.5?1:0)+" 1 "+x.toFixed(2)+" "+y.toFixed(2)+" Z";
    }
    function fmt(ms){ var s=Math.ceil(ms/1000), m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
    function paintTimer(){ wedge.setAttribute("d", wedgePath(remain/total)); read.textContent = remain>0 ? fmt(remain) : BF.L("Time!","Время!"); }
    function tick(t){
      if(!running) return;
      if(last) remain = Math.max(0, remain-(t-last)); last = t;
      paintTimer();
      if(remain<=0 && !chimed){ chimed = true; BF.sound.chime(); BF.ui.toast(BF.L("Timer's done — finish this bit, then tap Done.","Таймер закончился — доделай и нажми «Готово».")); running=false; setPlay(); return; }
      raf = requestAnimationFrame(tick);
    }
    function setPlay(){ playB.innerHTML = running ? I('pause',16)+' '+BF.L("Pause","Пауза") : I('play',16)+' '+(remain<total?BF.L("Resume","Продолжить"):BF.L("Start timer","Запустить таймер")); }
    function start(){ if(running||remain<=0) return; running=true; last=0; setPlay(); raf=requestAnimationFrame(tick); }
    function stop(){ running=false; cancelAnimationFrame(raf); setPlay(); }
    function drawCard(){
      var s = steps[i];
      el.querySelector("#qPeb").innerHTML = steps.map(function(_,k){ return '<span class="peb '+(k<i?'done':k===i?'now':'')+'">'+(k<i?BF.starSVG(18,true):'')+'</span>'; }).join("");
      card.classList.remove("flip"); void card.offsetWidth; card.classList.add("flip");
      card.innerHTML = '<p class="eyebrow">'+BF.L("Card "+(i+1)+" of "+steps.length,"Карточка "+(i+1)+" из "+steps.length)+'</p><div class="q-ill">'+BF.scene.render(sit.scene,{avatar:c.avatar,size:"thumb"})+'</div><h2 class="q-step">'+esc(s.text)+'</h2><p class="muted">'+BF.L("About "+s.min+" min. Just this card — nothing else yet.","Примерно "+s.min+" мин. Только эта карточка — больше ничего.")+'</p>'+
        '<button class="done-btn" id="qDone"><span class="db-inner">'+I('check',30)+'<b>'+BF.L("Done!","Готово!")+'</b></span></button>';
      card.querySelector("#qDone").onclick = done;
      stop(); total = s.min*60000; remain = total; chimed=false; paintTimer(); setPlay();
    }
    function done(e){
      BF.ui.burst(e.currentTarget, 1); earned++;
      BF.store.update(function(x){ x.done.push({date:BF.store.today(), plan:id, text:"Quest card: "+plan.ladder[i].text.en}); });
      BF.store.addStars(1, "quest card");
      i++;
      if(i>=steps.length){ finish(); return; }
      if(i===Math.ceil(steps.length/2)) setTimeout(openMove, 450);
      drawCard();
    }
    function finish(){
      stop();
      el.querySelector("#qPeb").innerHTML = steps.map(function(){ return '<span class="peb done">'+BF.starSVG(18,true)+'</span>'; }).join("");
      card.innerHTML = '<div class="q-finish"><div>'+A.svg(c.avatar,{size:170,pose:"cheer"})+'</div><h2>'+BF.L("Quest complete!","Квест пройден!")+'</h2><p>'+BF.L(hero+" finished every card and earned","Все карточки выполнены, заработано:")+' '+BF.ui.stars(earned, earned, 24)+'</p><div class="cel-actions"><button class="btn sage" id="qAgain">'+BF.L("Run it again","Пройти ещё раз")+'</button><a class="btn ghost" href="#/">'+BF.L("Evening check-in","Вечерний чек-ин")+'</a></div></div>';
      card.querySelector("#qAgain").onclick = function(){ i=0; earned=0; drawCard(); };
      BF.sound.done();
    }
    function openMove(){
      stop();
      var m = BF.MOVES[Math.floor(Math.random()*BF.MOVES.length)], box = el.querySelector("#qMove"), n = 60;
      el.querySelector("#mvT").textContent = T(m.t); el.querySelector("#mvD").textContent = T(m.d);
      el.querySelector("#mvKid").className = "mv-kid mv-"+m.anim;
      el.querySelector("#mvN").textContent = n; box.hidden = false;
      clearInterval(breakTimer);
      breakTimer = setInterval(function(){ n--; el.querySelector("#mvN").textContent = n; if(n<=0){ clearInterval(breakTimer); BF.sound.chime(); } }, 1000);
    }
    el.querySelector("#mvDone").onclick = function(){ clearInterval(breakTimer); el.querySelector("#qMove").hidden = true; };
    playB.onclick = function(){ BF.sound.unlock(); running ? stop() : start(); };
    el.querySelector("#qMore").onclick = function(){ total += 60000; remain += 60000; chimed=false; paintTimer(); };
    el.querySelector("#qWiggle").onclick = openMove;
    el.querySelector("#qSay").onclick = function(e){ BF.voice.speak(steps[i] ? steps[i].text : "", e.currentTarget); };
    drawCard();
    return function(){ stop(); clearInterval(breakTimer); };
  }
};

        }).join("")+'</div><div class="plank"></div></section>';

BF.screens.game = {

  render:function(el, id, query){

        BF.DAYPARTS.map(function(p){ return '<div class="mg-row"><span class="mg-part">'+T(p.t)+'</span>'+days.map(function(d){ var m = moodAt(d,p.v); return '<button class="mg-cell" data-d="'+d+'" data-p="'+p.v+'" '+(d>st.today()?'disabled':'')+' aria-label="'+T(p.t)+' '+d+'">'+(m?BF.moodFace(m.mood, view==="week"?34:64):'<span class="mp-empty">+</span>')+(m&&view==="day"?'<small>'+BF.ui.lbl(BF.MOODS,m.mood)+'</small>':'')+'</button>'; }).join("")+'</div>'; }).join("")+

    body.querySelectorAll(".mg-cell").forEach(function(b){ b.onclick = function(){ BF.moodPicker(b.getAttribute("data-d"), b.getAttribute("data-p"), function(){ V.moods(body, {view:view, date:anchor}); }); }; });

      '<div class="week-strip paper"><h3>'+BF.L("This week","Эта неделя")+'</h3><div class="ws-row">'+week.map(function(d){ var on = c.days.indexOf(d)>=0, n = c.starLog.filter(function(x){ return x.date===d; }).reduce(function(a,x){ return a+x.n; },0); return '<span class="ws '+(on?'on':'')+'"><small>'+BF.weekday(new Date(d+"T12:00:00"))+'</small>'+(on?BF.starSVG(24,true):'<i></i>')+'<b>'+(n||"")+'</b></span>'; }).join("")+'</div></div>'+
      '<h2>'+BF.L("Plans","Планы")+'</h2>'+(plans.length?'<div class="pl-list">'+plans.map(function(p){ var done = p.ladder.filter(function(r){ return r.done; }).length; return '<a class="pl paper" href="#/'+(p.tag==="adhd"?"quest":"brave")+'/'+p.id+'">'+BF.ui.tagChip(p.tag)+'<b>'+esc(BF.ui.sitTitle(p.id))+'</b><span class="bar"><i style="width:'+Math.round(done/p.ladder.length*100)+'%"></i></span><small>'+done+'/'+p.ladder.length+'</small></a>'; }).join("")+'</div>':'<p class="muted">'+BF.L("No plans yet.","Планов пока нет.")+' <a href="#/library">'+BF.L("Open the library","Открыть библиотеку")+'</a></p>')+

      '<h2>'+BF.L("Evening check-ins","Вечерние чек-ины")+'</h2>'+((c.checkins||[]).length?'<ul class="plain">'+c.checkins.slice(-8).reverse().map(function(x){ return '<li>'+BF.dateFmt(x.date)+': <b>'+({easy:BF.L("easy","легко"),ok:BF.L("okay","нормально"),hard:BF.L("too hard","слишком трудно")}[x.mood])+'</b> — '+esc(x.step)+'</li>'; }).join("")+'</ul>':'<p class="muted">'+BF.L("None yet.","Пока нет.")+'</p>');
  };
})();

</script>
<script data-src="js/screens/specialist.js">
/* Specialist tab: per-child progress, triggers, reactions, outcomes,
   diary/mood/sleep/food trends, correlations, printable A4 report,

var BF = window.BF = window.BF || {};
(function(){
  function range(days, from, to){
    var st = BF.store, out = [];
    if(from && to){ var a = new Date(from+"T12:00:00"), b = new Date(to+"T12:00:00"); for(var d=new Date(a); d<=b; d.setDate(d.getDate()+1)) out.push(st.dayKey(d)); return out; }
    for(var i=days-1;i>=0;i--){ var x = new Date(); x.setDate(x.getDate()-i); out.push(st.dayKey(x)); }

  }
  function avg(a){ a = a.filter(function(x){ return x!=null && !isNaN(x); }); return a.length ? a.reduce(function(s,x){ return s+x; },0)/a.length : null; }
  /* Collect per-day series for a child */

      var h = L ? BF.sleepHours(L.sleep) : null;
      S.sleep.push(h); S.wakings.push(L&&L.sleep.wakings!=null?L.sleep.wakings:null); S.quality.push(L?L.sleep.quality:null);
      var dm = avg((c.diary||[]).filter(function(e){ return e.at.slice(0,10)===d; }).map(function(e){ return e.mood; }));
      var sm = avg((c.moods||[]).filter(function(m){ return m.date===d; }).map(function(m){ return moodVal[m.mood]; }));
      S.diary.push(dm); S.stickers.push(sm); S.mood.push(dm!=null ? dm : sm);
      var oc = (c.outcomes||[]).filter(function(o){ return o.at.slice(0,10)===d; });
      S.meltdowns.push(oc.filter(function(o){ return (o.reaction||[]).some(function(r){ return r==="meltdown"||r==="shouted"||r==="cried"; }); }).length);
      ["managed","partly","not"].forEach(function(k){ S[k].push(oc.filter(function(o){ return o.result===k; }).length); });
      var has = L && (h!=null || L.screen || L.outdoor || L.activity);
      S.screen.push(has?L.screen:null); S.outdoor.push(has?L.outdoor:null); S.activity.push(has?L.activity:null);
      S.sugar.push(L&&L.food.sugar!=null?L.food.sugar:null); S.appetite.push(L?L.food.appetite:null);
      S.body.push(L&&L.body?L.body.length:0); S.school.push(L?L.school:null);
    });
    return S;
  };
  function strength(r){
    if(r==null) return BF.L("not enough data","мало данных");
    var a = Math.abs(r), dir = r>0 ? BF.L("goes up together","растут вместе") : BF.L("moves in opposite directions","меняются в противоположные стороны");
    var s = a<0.2 ? BF.L("no clear link","нет явной связи") : a<0.4 ? BF.L("weak link","слабая связь") : a<0.6 ? BF.L("moderate link","умеренная связь") : BF.L("strong link","сильная связь");
    return a<0.2 ? s : s+" — "+dir;
  }
  BF.specBlocks = function(c, S, opts){

    var diary = (c.diary||[]).filter(function(e){ return S.days.indexOf(e.at.slice(0,10))>=0; }).sort(function(a,b){ return a.at<b.at?1:-1; });
    var moods = (c.moods||[]).filter(function(m){ return S.days.indexOf(m.date)>=0; });
    var aSleep = avg(S.sleep), aMood = avg(S.mood), melt = S.meltdowns.reduce(function(a,b){ return a+b; },0), managed = outs.filter(function(o){ return o.result==="managed"; }).length;
    var steps = (c.done||[]).filter(function(x){ return S.days.indexOf(x.date)>=0; }).length, active = (c.days||[]).filter(function(d){ return S.days.indexOf(d)>=0; }).length;
    var markers = []; S.meltdowns.forEach(function(n,i){ if(n) markers.push({i:i, t:BF.L("Meltdown / crying","Срыв / слёзы")+" ×"+n}); });
    var b = {};
    b.summary = '<div class="stats-row">'+[
      [aSleep!=null?BF.ui.num(aSleep,1):"—", BF.L("avg sleep, h","средний сон, ч")],[aMood!=null?BF.ui.num(aMood,1):"—", BF.L("avg mood (1–5)","среднее настроение (1–5)")],
      [melt, BF.L("meltdowns / crying","срывов / слёз")],[outs.length?Math.round(managed/outs.length*100)+"%":"—", BF.L("triggers managed","триггеров преодолено")],
      [steps, BF.L("brave steps done","смелых шагов")],[active+"/"+S.days.length, BF.L("active days","активных дней")]].map(function(s){ return '<div class="stat paper"><b>'+s[0]+'</b><small>'+s[1]+'</small></div>'; }).join("")+'</div>';
    b.sleepMood = '<h3>'+BF.L("Sleep hours vs mood","Часы сна и настроение")+'</h3>'+CH.barsLine({ w:860, h:250, labels:S.labels, bars:S.sleep, bMin:6, bMax:11, line:S.mood, lMin:1, lMax:5, markers:markers, label:BF.L("Sleep hours (bars) and mood (line)","Сон (столбцы) и настроение (линия)") })+
      CH.legend([{color:COL.dusty,t:BF.L("Sleep, hours (left)","Сон, часы (слева)")},{color:COL.clay,t:BF.L("Mood 1–5 (right)","Настроение 1–5 (справа)")},{color:COL.clay,t:BF.L("▼ meltdown / crying","▼ срыв / слёзы")}]);

      CH.legend([{color:COL.sand,t:BF.L("Screen, min (left)","Экраны, мин (слева)")},{color:COL.clay,t:BF.L("Mood (right)","Настроение (справа)")}]);
    var factors = [ [BF.L("Sleep hours","Часы сна"), S.sleep], [BF.L("Night wakings","Ночные пробуждения"), S.wakings], [BF.L("Screen time","Экранное время"), S.screen], [BF.L("Outdoor time","Время на улице"), S.outdoor], [BF.L("Physical activity","Физическая активность"), S.activity], [BF.L("Sugar","Сахар"), S.sugar], [BF.L("Tummy / illness signs","Живот / болезнь"), S.body] ];

      factors.map(function(f){ var r1 = CH.pearson(f[1], S.mood), r2 = CH.pearson(f[1], S.meltdowns); return '<tr><td>'+f[0]+'</td><td><b>'+(r1==null?"—":BF.ui.num(r1,2))+'</b> <small>'+strength(r1)+'</small></td><td><b>'+(r2==null?"—":BF.ui.num(r2,2))+'</b> <small>'+strength(r2)+'</small></td></tr>'; }).join("")+'</tbody></table>'+
      '<p class="fine">'+BF.L("Pearson r over the selected days. Small samples can mislead — use as conversation starters, not conclusions.","Коэффициент Пирсона за выбранные дни. На малых выборках возможны случайности — это повод для разговора, а не вывод.")+'</p>';
    var bySit = {}; outs.forEach(function(o){ var x = bySit[o.sit] = bySit[o.sit] || {n:0, managed:0, partly:0, not:0, int:[], react:{}, helped:{}}; x.n++; x[o.result]++; x.int.push(o.intensity); (o.reaction||[]).forEach(function(r){ x.react[r]=(x.react[r]||0)+1; }); (o.helped||[]).forEach(function(h){ x.helped[h]=(x.helped[h]||0)+1; }); });

      Object.keys(bySit).sort(function(a,b){ return bySit[b].n-bySit[a].n; }).map(function(id){ var x = bySit[id]; return '<tr><td>'+esc(BF.ui.sitTitle(id))+'</td><td>'+x.n+'</td><td>'+x.managed+' / '+x.partly+' / '+x.not+'</td><td>'+BF.ui.num(avg(x.int),1)+'</td><td>'+top(x.react, BF.REACTIONS)+'</td><td>'+top(x.helped, BF.HELPERS)+'</td></tr>'; }).join("")+'</tbody></table>':'<p class="muted">'+BF.L("No trigger outcomes in this period.","За этот период нет записей о триггерах.")+'</p>');
    var byPart = {}; moods.forEach(function(m){ byPart[m.part] = byPart[m.part]||{}; byPart[m.part][m.mood] = (byPart[m.part][m.mood]||0)+1; });

<script data-src="js/games/trail.js">
/* Trail Tracer — fine motor: follow a winding trail with one finger without leaving it. */
var BF = window.BF = window.BF || {};
BF.games = BF.games || {};
BF.games.trail = {
  title:{en:"Trail Tracer",ru:"Тропинка"}, skill:{en:"Fine motor",ru:"Мелкая моторика"}, motor:true, time:{en:"2 min",ru:"2 мин"},
  howto:{en:"Put a finger on the hero and slowly follow the trail home. If you slip off, just come back — nothing resets.",ru:"Поставьте палец на героя и медленно ведите его по тропинке домой. Соскользнули — просто вернитесь, ничего не сбрасывается."},
  why:{en:"Slow, controlled finger movement builds pencil control and teaches the body that slowing down feels good.",ru:"Медленные точные движения пальцем развивают контроль карандаша и учат тело, что замедляться приятно."},
  art:function(){ return '<svg viewBox="0 0 120 90"><path d="M12 70 C30 20 50 80 70 34 S104 20 110 54" fill="none" stroke="#E7D7BC" stroke-width="16" stroke-linecap="round"/><path d="M12 70 C30 20 50 80 70 34" fill="none" stroke="#C98E70" stroke-width="5" stroke-linecap="round"/><circle cx="70" cy="34" r="8" fill="#FBF7EF" stroke="#A96C51" stroke-width="3"/><path d="M104 46 l6 -12 l6 12z" fill="#A3B59C"/></svg>'; },
  mount:function(stage, api){
    var U = BF.gameUtil, level = 0, slips = 0, TADJ = api.pick([10,0,-7]), COUNT = api.pick([2,3,3]);
    var LEVELS = [
      { d:"M70 270 C170 270 170 90 300 90 S430 270 530 120", tol:34 },
      { d:"M60 290 C120 120 200 110 230 210 S330 330 380 200 S470 60 545 100", tol:30 },
      { d:"M55 180 C90 60 170 60 190 170 S270 300 310 180 S380 40 430 150 S520 300 555 150", tol:27 }
    ];
    var svg, path, prog, token, home, samples, N = 360, idx = 0, len = 0, tracing = false, offT = 0;
    function build(){
      var L = {d:LEVELS[level].d, tol:LEVELS[level].tol+TADJ};
      stage.innerHTML = '<div class="lvl-tag">'+BF.L("Trail ","Тропинка ")+(level+1)+' / '+COUNT+'</div><svg class="g-svg" viewBox="0 0 600 360" aria-label="Tracing trail">'+
        '<path d="M0 330 C150 300 300 340 600 310 V360 H0Z" fill="#E9DCC5"/>'+
        '<path id="trTrack" d="'+L.d+'" fill="none" stroke="#D6C09C" stroke-width="'+(L.tol*2+4)+'" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<path d="'+L.d+'" fill="none" stroke="#F4ECDD" stroke-width="'+(L.tol*2-6)+'" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<path d="'+L.d+'" fill="none" stroke="#CDBA98" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/>'+
        '<path id="trProg" d="'+L.d+'" fill="none" stroke="#C98E70" stroke-width="12" stroke-linecap="round"/>'+
        '<g id="trHome"></g><g id="trTok"><circle r="30" fill="#FBF7EF" stroke="#A96C51" stroke-width="3"/><g transform="translate(-26 -27)">'+U.heroHead(52,0,0)+'</g><circle class="tok-ring" r="38" fill="none" stroke="#A96C51" stroke-width="2" stroke-dasharray="4 6"/></g></svg>';
      svg = stage.querySelector("svg"); path = stage.querySelector("#trTrack"); prog = stage.querySelector("#trProg"); token = stage.querySelector("#trTok"); home = stage.querySelector("#trHome");
      len = path.getTotalLength(); samples = [];
      for(var i=0;i<N;i++){ var p = path.getPointAtLength(len*i/(N-1)); samples.push({x:p.x,y:p.y}); }
      var e = samples[N-1];
      home.innerHTML = '<g transform="translate('+(e.x-34)+' '+(e.y-62)+')"><path d="M6 34 L34 8 L62 34 V64 H6Z" fill="#A3B59C"/><path d="M0 36 L34 4 L68 36" fill="none" stroke="#6F8A6E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="42" width="16" height="22" rx="7" fill="#FBF7EF"/></g>';
      prog.style.strokeDasharray = len; idx = 0; paint();
    }
    function paint(){
      var p = samples[idx]; token.setAttribute("transform","translate("+p.x+" "+p.y+")");
      prog.style.strokeDashoffset = len*(1-idx/(N-1));
    }
    function nearest(pt){
      var best=-1, bd=1e9, lo=Math.max(0, idx-12), hi=Math.min(N-1, idx+28);
      for(var i=lo;i<=hi;i++){ var d=U.dist(pt, samples[i]); if(d<bd){ bd=d; best=i; } }
      return {i:best, d:bd};
    }

  why:{en:"Holding where things are in mind is working memory — the same skill used to remember the next step of a routine.",ru:"Помнить, где что лежит, — это рабочая память. Тот же навык помогает помнить следующий шаг утренней рутины."},
  art:function(){ return '<svg viewBox="0 0 120 90"><rect x="14" y="14" width="40" height="56" rx="8" fill="#93A9BA" transform="rotate(-6 34 42)"/><rect x="64" y="16" width="40" height="56" rx="8" fill="#FBF7EF" stroke="#D6C09C" stroke-width="3" transform="rotate(5 84 44)"/><path d="M84 30 l4 8 9 1 -6 6 2 9 -9 -4 -8 4 2 -9 -6 -6 9 -1z" fill="#E4CC8F" transform="rotate(5 84 44)"/><circle cx="28" cy="36" r="4" fill="#D8E1E7"/><circle cx="40" cy="48" r="4" fill="#D8E1E7"/></svg>'; },
  mount:function(stage, api){

      chick: BF.avatar.chick(80),
      star: '<svg viewBox="0 0 40 40" width="70" height="70"><path d="M20 3.5l4.6 10 10.9 1.3-8.1 7.4 2.2 10.8L20 27.6l-9.6 5.4 2.2-10.8-8.1-7.4 10.9-1.3z" fill="#E4CC8F" stroke="#C7A65A" stroke-width="1.5" stroke-linejoin="round"/></svg>',
      moon: '<svg viewBox="0 0 40 40" width="66" height="66"><path d="M28 28 A13 13 0 1 1 18 6 A10 10 0 0 0 28 28z" fill="#B7C7D3"/><circle cx="14" cy="18" r="2" fill="#93A9BA"/><circle cx="18" cy="26" r="1.5" fill="#93A9BA"/></svg>',
      leaf: '<svg viewBox="0 0 40 40" width="66" height="66"><path d="M8 32 C8 16 18 7 33 6 C32 22 23 32 8 32z" fill="#A3B59C"/><path d="M8 32 C14 24 20 18 28 12" stroke="#6F8A6E" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
      cloud: '<svg viewBox="0 0 40 40" width="70" height="70"><path d="M9 28 q-6 0 -6 -6 q0 -6 7 -6 q1 -7 9 -7 q7 0 9 7 q8 0 8 6 q0 6 -7 6z" fill="#FBF7EF" stroke="#C9B9A0" stroke-width="2"/></svg>',
      sun: '<svg viewBox="0 0 40 40" width="66" height="66"><circle cx="20" cy="20" r="8" fill="#E4CC8F"/><g stroke="#C7A65A" stroke-width="2.5" stroke-linecap="round"><path d="M20 4v5M20 31v5M4 20h5M31 20h5M8.5 8.5l3.5 3.5M28 28l3.5 3.5M8.5 31.5l3.5-3.5M28 12l3.5-3.5"/></g></svg>',
      heart: '<svg viewBox="0 0 40 40" width="64" height="64"><path d="M20 33 C6 24 4 16 8 11 C12 6 18 8 20 13 C22 8 28 6 32 11 C36 16 34 24 20 33Z" fill="#D9B5A7" stroke="#B98166" stroke-width="2"/></svg>'
    };
    var PAIRS = api.pick([4,6,8]);
    var pool = Object.keys(FACES).slice(0, PAIRS), keys = U.shuffle(pool.concat(pool));
    stage.innerHTML = '<div class="mem-hud">'+BF.L("Moves: ","Ходы: ")+'<b id="mm">0</b> · '+BF.L("Pairs: ","Пары: ")+'<b id="mp">0</b>/'+PAIRS+'</div><div class="mem-grid mem-'+PAIRS+'">'+keys.map(function(k,i){
      return '<button class="mcard" data-k="'+k+'" aria-label="'+BF.L("Card ","Карточка ")+(i+1)+'"><span class="mc-in"><span class="mc-back"><svg viewBox="0 0 60 60" width="44" height="44"><circle cx="30" cy="30" r="18" fill="none" stroke="#FBF7EF" stroke-width="2" stroke-dasharray="3 5"/><path d="M30 20 l3 6 7 1 -5 5 1 7 -6 -3 -6 3 1 -7 -5 -5 7 -1z" fill="#FBF7EF" opacity=".75"/></svg></span><span class="mc-front">'+FACES[k]+'</span></span></button>';
    }).join("")+'</div>';
    stage.querySelectorAll(".mcard").forEach(function(c){

        if(lock || c.classList.contains("up") || c.classList.contains("got")) return;
        c.classList.add("up"); BF.sound.soft();
        if(!first){ first = c; return; }
        moves++; stage.querySelector("#mm").textContent = moves;
        if(first.getAttribute("data-k") === c.getAttribute("data-k")){
          first.classList.add("got"); c.classList.add("got"); found++; stage.querySelector("#mp").textContent = found; BF.sound.pop();
          api.say(c.getAttribute("data-k")==="hero" ? BF.L("You found yourself! Hero pair!","Ты нашёл себя! Пара героя!") : BF.L("A pair! Great remembering.","Пара! Отличная память."));
          first = null;
          if(found === PAIRS) api.win(moves<=PAIRS*1.7?3:moves<=PAIRS*2.5?2:1, BF.L(moves+" moves — sharp memory!","Ходов: "+moves+" — отличная память!"));
        } else {
          lock = true; var a = first; first = null;
          setTimeout(function(){ a.classList.remove("up"); c.classList.remove("up"); lock = false; }, 850);

<script data-src="js/games/backpack.js">
/* Pack the Backpack — routine sequencing: drag only today's items, in the order on the list. */
var BF = window.BF = window.BF || {};
BF.games = BF.games || {};
BF.games.backpack = {
  title:{en:"Pack the Backpack",ru:"Собери рюкзак"}, skill:{en:"Planning & order",ru:"Планирование и порядок"}, motor:true, time:{en:"2 min",ru:"2 мин"},
  howto:{en:"Look at the list. Drag the items into the backpack in that order. Toys stay home!",ru:"Посмотри на список. Перетащи вещи в рюкзак по порядку. Игрушки остаются дома!"},
  why:{en:"Following a short visual checklist is exactly how real mornings get easier — one item, then the next.",ru:"Короткий наглядный список — именно так утро становится легче: одна вещь, потом следующая."},
  art:function(){ return '<svg viewBox="0 0 120 90"><path d="M36 30 q0 -18 24 -18 q24 0 24 18" fill="none" stroke="#A96C51" stroke-width="5"/><rect x="28" y="28" width="64" height="56" rx="16" fill="#C98E70"/><rect x="40" y="52" width="40" height="22" rx="8" fill="#A96C51"/><rect x="6" y="20" width="18" height="24" rx="4" fill="#A3B59C"/><circle cx="104" cy="28" r="10" fill="#93A9BA"/></svg>'; },
  mount:function(stage, api){
    var U = BF.gameUtil, step = 0, mistakes = 0, T = BF.ui.T;
    var NEED = [
      { id:"lunch", n:{en:"Lunchbox",ru:"Ланч-бокс"}, svg:'<svg viewBox="0 0 60 50"><rect x="4" y="12" width="52" height="34" rx="8" fill="#A3B59C"/><rect x="4" y="12" width="52" height="10" rx="5" fill="#6F8A6E"/><path d="M22 12 v-5 h16 v5" fill="none" stroke="#6F8A6E" stroke-width="4" stroke-linecap="round"/></svg>' },
      { id:"water", n:{en:"Water bottle",ru:"Бутылка воды"}, svg:'<svg viewBox="0 0 40 60"><rect x="13" y="2" width="14" height="8" rx="2" fill="#5F7889"/><rect x="8" y="10" width="24" height="46" rx="9" fill="#93A9BA"/><rect x="8" y="26" width="24" height="10" fill="#D8E1E7"/></svg>' },
      { id:"book", n:{en:"Reading book",ru:"Книга для чтения"}, svg:'<svg viewBox="0 0 60 50"><rect x="6" y="6" width="46" height="38" rx="4" fill="#C98E70"/><rect x="12" y="6" width="4" height="38" fill="#A96C51"/><rect x="22" y="14" width="22" height="6" rx="2" fill="#FBF7EF"/></svg>' },
      { id:"pencils", n:{en:"Pencil case",ru:"Пенал"}, svg:'<svg viewBox="0 0 60 40"><rect x="4" y="8" width="52" height="26" rx="12" fill="#E4CC8F"/><path d="M10 14 h40" stroke="#C7A65A" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="14" r="3" fill="#6E655D"/></svg>' },
      { id:"folder", n:{en:"Homework folder",ru:"Папка с домашкой"}, svg:'<svg viewBox="0 0 60 50"><path d="M4 10 h20 l5 5 h27 v31 h-52z" fill="#D9B5A7"/><rect x="4" y="18" width="52" height="28" rx="3" fill="#E9CDBF"/></svg>' }
    ];
    var EXTRA = [
      { id:"car", n:{en:"Toy car",ru:"Машинка"}, svg:'<svg viewBox="0 0 60 40"><path d="M6 26 v-6 l8 -10 h22 l10 10 h8 v6z" fill="#93A9BA"/><circle cx="16" cy="28" r="6" fill="#3B3632"/><circle cx="44" cy="28" r="6" fill="#3B3632"/></svg>' },
      { id:"pad", n:{en:"Game controller",ru:"Джойстик"}, svg:'<svg viewBox="0 0 60 40"><path d="M10 10 h40 q8 0 8 12 q0 12 -8 12 q-6 0 -10 -6 h-20 q-4 6 -10 6 q-8 0 -8 -12 q0 -12 8 -12z" fill="#8B6F64"/><path d="M16 20 h8 M20 16 v8" stroke="#FBF7EF" stroke-width="3" stroke-linecap="round"/><circle cx="42" cy="18" r="2.5" fill="#FBF7EF"/><circle cx="47" cy="23" r="2.5" fill="#FBF7EF"/></svg>' },
      { id:"ball", n:{en:"Ball",ru:"Мяч"}, svg:'<svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="20" fill="#E4CC8F"/><path d="M5 25 h40 M25 5 q-12 20 0 40 M25 5 q12 20 0 40" stroke="#C7A65A" stroke-width="2.5" fill="none"/></svg>' },
      { id:"teddy", n:{en:"Teddy bear",ru:"Мишка"}, svg:'<svg viewBox="0 0 50 50"><circle cx="14" cy="12" r="7" fill="#B9A48A"/><circle cx="36" cy="12" r="7" fill="#B9A48A"/><circle cx="25" cy="22" r="14" fill="#C9B396"/><circle cx="20" cy="20" r="2" fill="#3B3632"/><circle cx="30" cy="20" r="2" fill="#3B3632"/><ellipse cx="25" cy="27" rx="5" ry="4" fill="#E9DCC5"/><rect x="14" y="34" width="22" height="14" rx="7" fill="#C9B396"/></svg>' },
      { id:"tablet", n:{en:"Tablet",ru:"Планшет"}, svg:'<svg viewBox="0 0 60 44"><rect x="6" y="4" width="48" height="36" rx="6" fill="#5F6B78"/><rect x="11" y="9" width="38" height="26" rx="2" fill="#B7C7D3"/></svg>' }
    ];
    NEED = NEED.slice(0, api.pick([3,5,5])); EXTRA = U.shuffle(EXTRA).slice(0, api.pick([1,3,5]));
    stage.innerHTML = '<div class="bp-wrap"><div class="bp-list paper"><h4>'+BF.L("Today\'s list","Список на сегодня")+'</h4><ol id="bpL">'+NEED.map(function(it,i){ return '<li data-i="'+i+'"><span class="bp-ico">'+it.svg+'</span>'+T(it.n)+'</li>'; }).join("")+'</ol></div>'+
      '<div class="bp-floor" id="bpF"></div><div class="bp-bag" id="bpB"><svg viewBox="0 0 200 220"><path d="M58 70 q0 -50 42 -50 q42 0 42 50" fill="none" stroke="#A96C51" stroke-width="12" stroke-linecap="round"/><rect x="30" y="62" width="140" height="150" rx="34" fill="#C98E70"/><path d="M30 104 q70 -30 140 0" fill="#A96C51"/><rect x="58" y="140" width="84" height="52" rx="16" fill="#A96C51"/><path d="M70 160 h60" stroke="#E4CC8F" stroke-width="4" stroke-linecap="round"/></svg><div class="bp-in" id="bpIn"></div></div></div>';
    var floor = stage.querySelector("#bpF"), bag = stage.querySelector("#bpB");
    var items = U.shuffle(NEED.map(function(x){ return Object.assign({need:true}, x); }).concat(EXTRA.map(function(x){ return Object.assign({need:false}, x); })));
    function highlight(){ stage.querySelectorAll("#bpL li").forEach(function(li){ var i=+li.getAttribute("data-i"); li.className = i<step?"done":i===step?"now":""; }); }
    var W = floor.clientWidth||400, H = floor.clientHeight||260, cols = W > 380 ? 4 : 3;
    items.forEach(function(it, i){
      var d = document.createElement("div"); d.className = "bp-item"; d.innerHTML = it.svg+'<small>'+T(it.n)+'</small>'; d.setAttribute("data-id", it.id);
      var col = i % cols, row = Math.floor(i/cols), rows = Math.ceil(items.length/cols);
      var x = (col+0.5)*(W/cols) - 38 + U.rand(-6,6), y = (row+0.5)*(H/rows) - 34 + U.rand(-6,6);
      d.style.left = x+"px"; d.style.top = y+"px"; d._home = {x:x,y:y}; d._it = it;
      floor.appendChild(d); drag(d);
    });
    function overBag(x,y){ var r = bag.getBoundingClientRect(); return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom; }
    function drag(d){
      var sx, sy, ox, oy, on=false;
      d.addEventListener("pointerdown", function(e){ e.preventDefault(); on=true; try{ d.setPointerCapture(e.pointerId); }catch(_){} sx=e.clientX; sy=e.clientY; ox=parseFloat(d.style.left); oy=parseFloat(d.style.top); d.classList.add("lift"); });
      d.addEventListener("pointermove", function(e){ if(!on) return; d.style.left=(ox+e.clientX-sx)+"px"; d.style.top=(oy+e.clientY-sy)+"px"; bag.classList.toggle("hover", overBag(e.clientX,e.clientY)); });
      function end(e){ if(!on) return; on=false; d.classList.remove("lift"); bag.classList.remove("hover");
        if(overBag(e.clientX, e.clientY)){
          var it = d._it;
          if(!it.need){ mistakes++; api.say(BF.L("The "+it.n.en.toLowerCase()+" stays home today — it'll be waiting after school.","«"+it.n.ru+"» сегодня остаётся дома — подождёт после школы.")); BF.sound.soft(); back(d); return; }
          if(it.id !== NEED[step].id){ mistakes++; api.say(BF.L("Good item! But first: "+NEED[step].n.en.toLowerCase()+". Check the list.","Нужная вещь! Но сначала: «"+NEED[step].n.ru+"». Посмотри в список.")); BF.sound.soft(); back(d); return; }
          d.classList.add("packed"); stage.querySelector("#bpIn").appendChild(d); d.style.left=""; d.style.top="";
          step++; highlight(); BF.sound.pop(); bag.classList.add("gulp"); setTimeout(function(){ bag.classList.remove("gulp"); }, 350);
          if(step >= NEED.length){ api.win(mistakes<=1?3:mistakes<=3?2:1, BF.L("Backpack ready — out the door!","Рюкзак собран — можно выходить!")); }
          else api.say(BF.L("Packed! Next on the list: "+NEED[step].n.en.toLowerCase()+".","Уложено! Дальше по списку: «"+NEED[step].n.ru+"»."));
        } else back(d);
      }
      d.addEventListener("pointerup", end); d.addEventListener("pointercancel", end);
    }
    function back(d){ d.classList.add("nope"); d.style.left=d._home.x+"px"; d.style.top=d._home.y+"px"; setTimeout(function(){ d.classList.remove("nope"); }, 400); }
    highlight();
    return function(){};
  }
};

</script>
<script data-src="js/games/lace.js">
/* Lace It Up — fine motor: pull the shoelace from hole to hole, in number order. */
var BF = window.BF = window.BF || {};
BF.games = BF.games || {};
BF.games.lace = {
  title:{en:"Lace It Up",ru:"Зашнуруй"}, skill:{en:"Fine motor",ru:"Мелкая моторика"}, motor:true, time:{en:"2 min",ru:"2 мин"},
  howto:{en:"Grab the tip of the lace and pull it to the glowing hole. Follow the numbers.",ru:"Возьми кончик шнурка и тяни к светящейся дырочке. Следуй за цифрами."},
  why:{en:"Aiming a finger to a small target, then the next, builds hand–eye control — the same skill as real laces and buttons.",ru:"Попадать пальцем в маленькую цель, затем в следующую, — это координация «глаз–рука», как с настоящими шнурками и пуговицами."},
  art:function(){ return '<svg viewBox="0 0 120 90"><path d="M10 66 q0 -30 30 -38 l30 -8 q20 0 22 20 l14 10 q8 8 0 18 h-96z" fill="#93A9BA"/><rect x="8" y="74" width="104" height="8" rx="4" fill="#5F7889"/>'+[[46,36],[60,32],[50,48],[66,44]].map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.4" fill="#FBF7EF"/>';}).join("")+'<path d="M46 36 L60 32 L50 48 L66 44" stroke="#C98E70" stroke-width="3" fill="none" stroke-linecap="round"/></svg>'; },
  mount:function(stage, api){
    var U = BF.gameUtil, round = 0, slips = 0, SHOES = api.pick([[6],[6,10],[10,12]]), svg, holes, next, dragging = false, laceG, band, tip;
    function holesFor(n){
      var rows = n/2, out = [], top = 118, bottom = 252, gap = (bottom-top)/(rows-1);
      for(var r=0;r<rows;r++){ var y = bottom - r*gap, inset = r*3; out.push({x:246+inset, y:y}); out.push({x:354-inset, y:y}); }
      return out;
    }
    function build(){
      var n = SHOES[round];
      holes = holesFor(n); next = 1;
      stage.innerHTML = '<div class="lvl-tag">'+BF.L("Shoe ","Ботинок ")+(round+1)+' / '+SHOES.length+'</div><svg class="g-svg" viewBox="0 0 600 360" aria-label="Lacing shoe">'+
        '<ellipse cx="300" cy="346" rx="120" ry="10" fill="#3B3632" opacity=".07"/>'+
        '<path d="M300 14 C384 14 414 90 409 170 C404 252 392 344 300 345 C208 344 196 252 191 170 C186 90 216 14 300 14Z" fill="'+(round?'#6F8A6E':'#5F7889')+'"/>'+
        '<path d="M300 26 C372 26 399 92 395 170 C391 248 382 332 300 333 C218 332 209 248 205 170 C201 92 228 26 300 26Z" fill="'+(round?'#A3B59C':'#93A9BA')+'"/>'+
        '<path d="M300 26 C372 26 399 92 395 118 C356 98 244 98 205 118 C201 92 228 26 300 26Z" fill="'+(round?'#C9D3C1':'#B7C7D3')+'"/>'+
        '<rect x="262" y="96" width="76" height="196" rx="30" fill="'+(round?'#DCE4D5':'#D8E1E7')+'"/>'+
        '<ellipse cx="300" cy="300" rx="56" ry="30" fill="'+(round?'#6F8A6E':'#5F7889')+'"/><ellipse cx="300" cy="304" rx="44" ry="20" fill="#E9DCC5"/>'+
        '<path d="M222 60 q-14 40 -14 110" stroke="#fff" stroke-opacity=".35" stroke-width="6" fill="none" stroke-linecap="round"/>'+
        '<g transform="translate(40 120)">'+BF.gameUtil.heroHead(110,0,0)+'</g>'+
        '<g transform="translate(470 210) scale(.9)">'+BF.avatar.chick(100).replace('<svg ','<svg x="0" y="0" ')+'</g>'+
        '<g id="lc"></g><g id="hl">'+holes.map(function(h,i){ return '<g class="hole" data-i="'+i+'"><circle cx="'+h.x+'" cy="'+h.y+'" r="13" fill="#FBF7EF" stroke="#6E655D" stroke-width="3"/><text x="'+(h.x + (i%2? 30:-30))+'" y="'+(h.y+5)+'" text-anchor="middle" class="hole-n">'+(i+1)+'</text></g>'; }).join("")+'</g>'+
        '<line id="band" stroke="#C98E70" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 0" opacity="0"/>'+
        '<g id="tip"><circle r="22" fill="#C98E70" opacity=".18"/><rect x="-6" y="-14" width="12" height="28" rx="5" fill="#A96C51"/></g></svg>';
      svg = stage.querySelector("svg"); laceG = stage.querySelector("#lc"); band = stage.querySelector("#band"); tip = stage.querySelector("#tip");
      mark(0); placeTip(holes[0]);
    }
    function mark(i){
      stage.querySelectorAll(".hole").forEach(function(g){ var k=+g.getAttribute("data-i"); g.classList.toggle("done", k<=i); g.classList.toggle("next", k===i+1); });
    }
    function placeTip(p){ tip.setAttribute("transform","translate("+p.x+" "+p.y+")"); }
    function down(e){
      var pt = U.svgPoint(svg, e), from = holes[next-1];
      if(U.dist(pt, from) < 44){ dragging = true; try{ svg.setPointerCapture(e.pointerId); }catch(_){} band.setAttribute("opacity","1"); move(e); }
      else api.say(BF.L("Grab the lace tip first — it's on hole "+next+".","Сначала возьми кончик шнурка — он у дырочки "+next+"."));
    }
    function move(e){
      if(!dragging) return;
      var pt = U.svgPoint(svg, e), from = holes[next-1];
      band.setAttribute("x1", from.x); band.setAttribute("y1", from.y); band.setAttribute("x2", pt.x); band.setAttribute("y2", pt.y);
      placeTip(pt);
      var target = holes[next];
      if(target && U.dist(pt, target) < 24){
        var over = next % 2 === 0;
        laceG.insertAdjacentHTML("beforeend", '<line x1="'+from.x+'" y1="'+from.y+'" x2="'+target.x+'" y2="'+target.y+'" stroke="'+(over?'#C98E70':'#A96C51')+'" stroke-width="8" stroke-linecap="round" class="lace-seg"/>');
        mark(next); next++; BF.sound.pop();
        band.setAttribute("x1", target.x); band.setAttribute("y1", target.y);
        if(next >= holes.length){ dragging = false; band.setAttribute("opacity","0"); placeTip(target); finish(); }
        else api.say([BF.L("Through it!","Продето!"),BF.L("Nice aim.","Точно!"),BF.L("Next hole is glowing.","Следующая дырочка светится."),BF.L("Steady fingers!","Уверенные пальцы!")][next%4]);
      }
    }
    function up(){
      if(!dragging) return; dragging = false; band.setAttribute("opacity","0"); placeTip(holes[next-1]);
      slips++; api.say(BF.L("The lace slipped back — no problem. Grab the tip again.","Шнурок выскользнул — ничего страшного. Возьми кончик снова."));
    }
    function finish(){
      var a = holes[holes.length-2], b = holes[holes.length-1], cx = (a.x+b.x)/2, cy = a.y-24;
      laceG.insertAdjacentHTML("beforeend", '<g class="bow"><path d="M'+cx+' '+cy+' C'+(cx-50)+' '+(cy-40)+' '+(cx-60)+' '+(cy+10)+' '+cx+' '+cy+' C'+(cx+60)+' '+(cy+10)+' '+(cx+50)+' '+(cy-40)+' '+cx+' '+cy+'Z" fill="none" stroke="#C98E70" stroke-width="8" stroke-linejoin="round"/><path d="M'+cx+' '+cy+' l-18 40 M'+cx+' '+cy+' l18 40" stroke="#A96C51" stroke-width="7" stroke-linecap="round"/><circle cx="'+cx+'" cy="'+cy+'" r="8" fill="#A96C51"/></g>');
      tip.style.display = "none"; BF.sound.star();
      if(round < SHOES.length-1){ round++; api.say(BF.L("Tied! Now a longer shoe…","Завязано! Теперь ботинок подлиннее…")); setTimeout(build, 1100); }
      else api.win(slips<=2?3:slips<=5?2:1, BF.L("All laced up!","Всё зашнуровано!"));
    }
    stage.addEventListener("pointerdown", function(e){ if(svg) down(e); });
    stage.addEventListener("pointermove", function(e){ if(svg) move(e); });
    stage.addEventListener("pointerup", up);
    stage.addEventListener("pointercancel", up);
    build();

<script data-src="js/games/dots.js">

  howto:{en:"Start at 1. Slide your finger to 2, then 3… Each dot lights up when you reach it.",ru:"Начни с 1. Веди пальцем к 2, потом к 3… Точка загорается, когда ты до неё дошёл."},

  art:function(){ return '<svg viewBox="0 0 120 90"><path d="M60 8 L72 34 L100 36 L78 54 L86 82 L60 66" fill="none" stroke="#C98E70" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+[[60,8],[72,34],[100,36],[78,54],[86,82],[60,66],[34,82],[42,54],[20,36],[48,34]].map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+(i<6?'#A96C51':'#CDBFA8')+'"/>';}).join("")+'</svg>'; },
  mount:function(stage, api){
    var U = BF.gameUtil, round = 0, NPIC = api.pick([2,3,3]), HIT = api.pick([32,26,18]), svg, next = 0, pressed = false, pts, lines, prev;
    function starPts(){ var o=[]; for(var i=0;i<10;i++){ var a=-Math.PI/2 + i*Math.PI/5, r=i%2?62:150; o.push({x:300+Math.cos(a)*r, y:192+Math.sin(a)*r}); } return o; }
    var SHAPES = [
      { name:{en:"a star",ru:"звезда"}, fill:"#E4CC8F", pts:starPts(), extra:'' },
      { name:{en:"a little house",ru:"домик"}, fill:"#A3B59C", pts:[{x:180,y:320},{x:180,y:190},{x:140,y:190},{x:300,y:60},{x:460,y:190},{x:420,y:190},{x:420,y:320}],
        extra:'<rect x="270" y="236" width="60" height="84" rx="26" fill="#FBF7EF"/><rect x="200" y="210" width="44" height="40" rx="6" fill="#D8E1E7"/><rect x="356" y="210" width="44" height="40" rx="6" fill="#D8E1E7"/>' },
      { name:{en:"a calm fish",ru:"спокойная рыбка"}, fill:"#93A9BA", pts:[{x:110,y:190},{x:190,y:118},{x:320,y:104},{x:420,y:170},{x:520,y:104},{x:500,y:190},{x:520,y:276},{x:420,y:210},{x:320,y:276},{x:190,y:262}],
        extra:'<circle cx="186" cy="176" r="12" fill="#FBF7EF"/><circle cx="188" cy="176" r="6" fill="#3B3632"/><path d="M260 150 q30 40 0 80 M300 140 q30 50 0 100" stroke="#D8E1E7" stroke-width="5" fill="none" stroke-linecap="round"/>' }
    ];
    function build(){
      var S = SHAPES[round]; pts = S.pts; next = 0;
      stage.innerHTML = '<div class="lvl-tag">'+BF.L("Picture ","Картинка ")+(round+1)+' / '+NPIC+'</div><svg class="g-svg" viewBox="0 0 600 380" aria-label="Dot to dot">'+

        '<g id="dLines"></g><line id="dPrev" stroke="#C98E70" stroke-width="4" stroke-dasharray="4 8" stroke-linecap="round" opacity="0"/>'+

      if(!svg || !pressed) return; var pt = U.svgPoint(svg, e);

      hit(pt);
    });
    function up(){ pressed = false; if(prev) prev.setAttribute("opacity","0"); }
    stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
    build();
    return function(){};
  }
};

<script data-src="js/games/keys.js">
/* Keyboard Hunt — find letters on an on-screen keyboard (Latin or Cyrillic, follows the UI language).
   Easy: single letters, no timer, a gentle hint. Medium: letter pairs, soft timer, one decoy glow.
   Hard: short words, faster timer, two decoy glows. */
var BF = window.BF = window.BF || {};
BF.games = BF.games || {};
BF.games.keys = {
  title:{en:"Keyboard Hunt",ru:"Охота за буквами"}, skill:{en:"Visual search & letters",ru:"Зрительный поиск и буквы"}, motor:false, time:{en:"2 min",ru:"2 мин"},
  howto:{en:"Find the letter on the keyboard and tap it. Longer levels ask for two or three letters in a row.",ru:"Найди букву на клавиатуре и нажми её. На сложных уровнях — две-три буквы подряд."},
  why:{en:"Scanning a busy keyboard for one letter, while ignoring glowing decoys, trains selective attention — and makes letters familiar.",ru:"Искать одну букву на клавиатуре, не отвлекаясь на мигающие «приманки», — это тренировка избирательного внимания и знакомство с буквами."},
  art:function(){ var k = ""; for(var r=0;r<3;r++) for(var i=0;i<(7-r);i++) k += '<rect x="'+(10+r*7+i*15)+'" y="'+(30+r*17)+'" width="12" height="13" rx="3" fill="'+((r===1&&i===2)?'#C98E70':'#E9DCC5')+'"/>'; return '<svg viewBox="0 0 120 90"><rect x="4" y="24" width="112" height="60" rx="10" fill="#93A9BA"/>'+k+'<rect x="44" y="4" width="32" height="18" rx="6" fill="#FBF7EF" stroke="#C98E70" stroke-width="2"/><text x="60" y="18" text-anchor="middle" font-size="13" font-weight="700" fill="#A96C51">A</text></svg>'; },
  mount:function(stage, api){
    var U = BF.gameUtil, ru = BF.lang()==="ru";
    var ROWS = ru ? ["ЙЦУКЕНГШЩЗХ","ФЫВАПРОЛДЖЭ","ЯЧСМИТЬБЮ"] : ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
    var ALL = ROWS.join("").replace(/[ЬЪЙ]/g,"").split("");
    var WORDS = ru ? ["КОТ","ДОМ","СОК","ЛЕС","МЯЧ","СУП","ЛУК","СЫР","НОС","РОТ","ЖУК","ЁЖ".replace("Ё","Е")] : ["CAT","SUN","DOG","HAT","BED","CUP","MAP","BUS","OWL","FOX","BEE","PIG"];
    var N = api.pick([8,9,8]), TIME = api.pick([0,9000,7000]), DECOYS = api.pick([0,1,2]);
    var targets = [];
    for(var i=0;i<N;i++){
      if(api.lv===0) targets.push(ALL[Math.floor(Math.random()*ALL.length)]);
      else if(api.lv===1) targets.push(i%2 ? ALL[Math.floor(Math.random()*ALL.length)]+ALL[Math.floor(Math.random()*ALL.length)] : ALL[Math.floor(Math.random()*ALL.length)]);
      else targets.push(WORDS[Math.floor(Math.random()*WORDS.length)]);
    }
    var t = 0, pos = 0, misses = 0, timer = 0, hintT = 0, decoyT = 0, t0 = 0, raf = 0, over = false;
    stage.innerHTML = '<div class="kh"><div class="kh-top"><span class="kh-hero">'+BF.avatar.svg(BF.store.s.avatar,{size:64, headOnly:true})+'</span><div class="kh-card paper" id="khCard"></div><span class="kh-count" id="khN"></span></div>'+
      '<div class="kh-bar'+(TIME?'':' hidden')+'"><i id="khBar"></i></div>'+
      '<div class="kb'+(ru?' kb-ru':'')+'" role="group" aria-label="'+BF.L("Keyboard","Клавиатура")+'">'+ROWS.map(function(r){ return '<div class="kb-row">'+r.split("").map(function(ch){ return '<button class="kb-k" data-ch="'+ch+'">'+ch+'</button>'; }).join("")+'</div>'; }).join("")+'</div></div>';
    var card = stage.querySelector("#khCard"), bar = stage.querySelector("#khBar");
    function keyEl(ch){ return stage.querySelector('.kb-k[data-ch="'+ch+'"]'); }
    function show(){
      var w = targets[t];
      card.innerHTML = w.split("").map(function(ch, i){ return '<span class="'+(i<pos?'got':i===pos?'now':'')+'">'+ch+'</span>'; }).join("");
      stage.querySelector("#khN").textContent = (t+1)+" / "+N;
      clearTimeout(hintT); stage.querySelectorAll(".kb-k.hint").forEach(function(k){ k.classList.remove("hint"); });
      if(api.lv===0) hintT = setTimeout(function(){ var k = keyEl(w[pos]); if(k) k.classList.add("hint"); api.say(BF.L("Look — it's glowing softly.","Смотри — она тихонько светится.")); }, 5000);

      show();
    }
    function press(ch){
      if(over) return;
      var k = keyEl(ch), want = targets[t][pos];
      if(ch === want){
        if(k){ k.classList.add("ok"); setTimeout(function(){ k.classList.remove("ok"); }, 300); }
        BF.sound.pop(); pos++;
        if(pos >= targets[t].length){ api.say([BF.L("Found it!","Нашёл!"),BF.L("Yes!","Да!"),BF.L("Sharp eyes.","Зоркие глаза.")][t%3]); next(); } else show();
      } else {
        misses++; BF.sound.soft();
        if(k){ k.classList.add("no"); setTimeout(function(){ k.classList.remove("no"); }, 350); }
        api.say(BF.L("Not that one — look for ","Не эта — ищи ")+want+".");
      }

    stage.querySelectorAll(".kb-k").forEach(function(b){ b.addEventListener("click", function(){ press(b.getAttribute("data-ch")); }); });
    function kd(e){ if(e.key && e.key.length===1){ var ch = e.key.toUpperCase().replace("Ё","Е"); if(ROWS.join("").indexOf(ch)>=0){ e.preventDefault(); press(ch); } } }

      if(TIME){ var f = Math.min(1, (now - t0)/TIME); bar.style.transform = "scaleX("+(1-f).toFixed(3)+")";
        if(f>=1){ misses++; api.say(BF.L("Time's up for that one — next!","Время вышло — следующая!")); next(); } }
      raf = requestAnimationFrame(loop);
    }
    show(); decoy(); raf = requestAnimationFrame(loop);
    return function(){ over = true; cancelAnimationFrame(raf); clearTimeout(hintT); clearTimeout(decoyT); window.removeEventListener("keydown", kd); };
  }

      function end(e){ if(!on) return; on = false; d.classList.remove("lift"); d.style.transform = ""; stage.querySelectorAll(".pz-slot").forEach(function(x){ x.classList.remove("hover"); });
        var s = slotAt(e.clientX, e.clientY); if(!s) return;
        if(s.getAttribute("data-i") === d.getAttribute("data-i") && !s.firstChild){ s.appendChild(d); d.classList.add("set"); BF.sound.pop(); left--;
          if(left === 0){ board.classList.add("done"); BF.sound.star(); setTimeout(function(){ api.win(wrong<=1?3:wrong<=4?2:1, BF.L("The picture is whole!","Картинка собрана!")); }, 500); }
          else api.say([BF.L("Click! It fits.","Щёлк! Подходит."),BF.L("Nice match.","Точно на месте."),BF.L("Keep going, slowly.","Продолжай, не спеша.")][left%3]);
        } else { wrong++; BF.sound.soft(); api.say(BF.L("Not quite there — compare the edges with the faint picture.","Не совсем — сравни края с бледной картинкой.")); }
      }
      d.addEventListener("pointerup", end); d.addEventListener("pointercancel", end);
    }
    return function(){};
  }
};

</script>
<script data-src="js/games/sizes.js">
/* Little to Big — line up nesting dolls by size. Harder levels: more dolls, closer sizes, and a reversed rule. */
var BF = window.BF = window.BF || {};
BF.games = BF.games || {};
BF.games.sizes = {
  title:{en:"Little to Big",ru:"От маленького к большому"}, skill:{en:"Comparing & order",ru:"Сравнение и порядок"}, motor:true, time:{en:"1–2 min",ru:"1–2 мин"},
  howto:{en:"Drag the dolls onto the shelf from the smallest to the biggest. Watch for a rule change!",ru:"Перетащи матрёшек на полку от самой маленькой к самой большой. Следи — правило может поменяться!"},
  why:{en:"Comparing sizes and keeping an order in mind builds early math thinking and step-by-step planning.",ru:"Сравнение размеров и удержание порядка развивают математическое мышление и пошаговое планирование."},
  art:function(){ function doll(x, s, c){ return '<g transform="translate('+x+' '+(84-60*s)+') scale('+s+')"><ellipse cx="14" cy="40" rx="14" ry="20" fill="'+c+'"/><circle cx="14" cy="14" r="11" fill="'+c+'"/><circle cx="14" cy="15" r="7" fill="#F4E4D4"/></g>'; } return '<svg viewBox="0 0 120 90">'+doll(10,0.5,"#93A9BA")+doll(32,0.75,"#A3B59C")+doll(64,1,"#C98E70")+'<rect x="4" y="84" width="112" height="5" rx="2" fill="#B9A48A"/></svg>'; },
  mount:function(stage, api){
    var U = BF.gameUtil, COLS = ["#93A9BA","#A3B59C","#C98E70","#E4CC8F","#D9B5A7","#8B6F64"];
    var ROUNDS = api.pick([[{n:3,gap:0.28,rev:false}],[{n:4,gap:0.18,rev:false},{n:5,gap:0.15,rev:false}],[{n:5,gap:0.12,rev:false},{n:6,gap:0.09,rev:true}]]);
    var r = 0, mistakes = 0, need = 0, sizes;
    function doll(s, c){ return '<svg viewBox="0 0 60 100" style="height:'+Math.round(120*s)+'px"><ellipse cx="30" cy="70" rx="26" ry="29" fill="'+c+'"/><path d="M8 66 q22 12 44 0" stroke="#FBF7EF" stroke-width="3" fill="none" opacity=".7"/><circle cx="30" cy="30" r="21" fill="'+c+'"/><circle cx="30" cy="32" r="14" fill="#F4E4D4"/><circle cx="25" cy="31" r="1.8" fill="#3B3632"/><circle cx="35" cy="31" r="1.8" fill="#3B3632"/><path d="M26 37 q4 3 8 0" stroke="#A96C51" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="30" cy="70" r="6" fill="#FBF7EF" opacity=".8"/></svg>'; }
    function build(){
      var R = ROUNDS[r]; need = 0;
      sizes = []; for(var i=0;i<R.n;i++) sizes.push(1 - (R.n-1-i)*R.gap);
      if(R.rev) sizes.reverse();
      var items = sizes.map(function(s, i){ return {s:s, k:i, c:COLS[i%COLS.length]}; });
      U.shuffle(items);
      stage.innerHTML = '<div class="lvl-tag">'+(R.rev?BF.L("New rule: biggest to smallest!","Новое правило: от большой к маленькой!"):BF.L("Smallest to biggest","От маленькой к большой"))+'</div><div class="sz"><div class="sz-shelf" id="szS">'+sizes.map(function(_, i){ return '<div class="sz-slot" data-i="'+i+'"><small>'+(i+1)+'</small></div>'; }).join("")+'</div><div class="sz-tray">'+items.map(function(it){ return '<div class="sz-doll" data-k="'+it.k+'">'+doll(it.s, it.c)+'</div>'; }).join("")+'</div></div>';
      if(R.rev) api.say(BF.L("Rule change! Now the biggest goes first.","Правило поменялось! Теперь первой идёт самая большая."));
      stage.querySelectorAll(".sz-doll").forEach(drag);
    }
    function shelfHit(x, y){ var r = stage.querySelector("#szS").getBoundingClientRect(); return x>=r.left-20 && x<=r.right+20 && y>=r.top-40 && y<=r.bottom+20; }
    function drag(d){
      var sx, sy, on = false;
      d.addEventListener("pointerdown", function(e){ if(d.classList.contains("set")) return; e.preventDefault(); on = true; try{ d.setPointerCapture(e.pointerId); }catch(_){} sx = e.clientX; sy = e.clientY; d.classList.add("lift"); });
      d.addEventListener("pointermove", function(e){ if(on) d.style.transform = "translate("+(e.clientX-sx)+"px,"+(e.clientY-sy)+"px)"; });
      function end(e){ if(!on) return; on = false; d.classList.remove("lift"); d.style.transform = "";
        if(!shelfHit(e.clientX, e.clientY)) return;
        if(+d.getAttribute("data-k") === need){
          stage.querySelector('.sz-slot[data-i="'+need+'"]').appendChild(d); d.classList.add("set"); need++; BF.sound.pop();
          if(need >= sizes.length){ BF.sound.star();
            if(r < ROUNDS.length-1){ r++; api.say(BF.L("A perfect line!","Ровный ряд!")); setTimeout(build, 900); }
            else api.win(mistakes<=1?3:mistakes<=3?2:1, BF.L("Every doll in order!","Все матрёшки по порядку!"));
          }
        } else { mistakes++; BF.sound.soft(); d.classList.add("nope"); setTimeout(function(){ d.classList.remove("nope"); }, 400);
          api.say(ROUNDS[r].rev ? BF.L("Find the biggest one that's left.","Найди самую большую из оставшихся.") : BF.L("Find the smallest one that's left.","Найди самую маленькую из оставшихся.")); }
      }
      d.addEventListener("pointerup", end); d.addEventListener("pointercancel", end);
    }
    build();
    return function(){};
  }
};

</script>
<script data-src="js/app.js">
/* Boot + app shell (header, footer, mobile tab bar) */

      '<nav class="mainnav" aria-label="'+BF.L("Main","Главное меню")+'">'+navItems().map(function(n){ return '<a href="'+n.href+'" data-nav="'+n.k+'">'+n.t+'</a>'; }).join("")+'<a href="#/pricing" data-nav="pricing">'+BF.L("Plans","Тарифы")+'</a></nav>'+

        '<button class="kid-switch" id="kidSwitch" aria-haspopup="true" aria-expanded="false" title="'+BF.L("Switch child","Сменить ребёнка")+'">'+BF.avatar.svg(c.avatar,{size:30, headOnly:true})+'<span>'+esc(BF.ui.heroName(c))+'</span>'+(c.isDemo?'<small class="demo-tag">'+BF.L("demo","демо")+'</small>':'')+'</button>'+
        '<div class="langsw" role="group" aria-label="Language / Язык"><button data-lang="en" aria-pressed="'+(BF.lang()==="en")+'">EN</button><button data-lang="ru" aria-pressed="'+(BF.lang()==="ru")+'">RU</button></div>'+
        '<button class="tgl icon-only" id="themeToggle" aria-pressed="'+(s.theme==="dark")+'" title="'+BF.L("Dark theme","Тёмная тема")+'"><span class="tgl-ico">'+I(s.theme==="dark"?"sun":"moon",18)+'</span></button>'+
        '<button class="tgl" id="calmToggle" aria-pressed="'+(!!s.calm)+'" title="'+BF.L("Calm mode: less motion, no sound","Спокойный режим: меньше движения, без звука")+'"><span class="tgl-ico">'+I("leaf",18)+'</span><span class="tgl-lbl">'+BF.L("Calm","Спокойно")+'</span></button>'+
        '<button class="tgl icon-only" id="soundToggle" aria-pressed="'+(!!s.sound && !s.calm)+'" title="'+BF.L("Soft sounds (off by default)","Мягкие звуки (по умолчанию выкл.)")+'"><span class="tgl-ico">'+I(s.sound && !s.calm ? "soundOn" : "soundOff",18)+'</span></button>'+
        '<a class="tgl icon-only" href="#/settings" data-nav="settings" title="'+BF.L("Settings","Настройки")+'"><span class="tgl-ico">'+I("gear",18)+'</span></a>'+
      '</div>';
    document.getElementById("tabbar").innerHTML = navItems().map(function(n){ return '<a href="'+n.href+'" data-nav="'+n.k+'">'+I(n.ico,22)+'<span>'+n.t+'</span></a>'; }).join("");
    document.getElementById("foot").innerHTML =
      '<p><b>Balapan Focus &amp; Calm</b> — '+BF.L("daily parent support, inspired by research on parent-based approaches. Not therapy and not a medical device; it does not diagnose or treat any condition.","ежедневная поддержка родителя, вдохновлённая исследованиями подхода через родителя. Это не терапия и не медицинское изделие; сервис не ставит диагнозы и не лечит.")+
      ' <a href="#/safety">'+BF.L("Safety &amp; when to talk to a specialist","Безопасность и когда обратиться к специалисту")+'</a> · '+BF.L("In the US, call or text <b>988</b> in a crisis · <b>911</b> for emergencies.","В США в кризисной ситуации — звонок или SMS на <b>988</b> · <b>911</b> — экстренные службы. В Казахстане — <b>112</b>, телефон доверия для детей <b>150</b>.")+'</p>'+
      '<p class="foot-small">'+BF.L("Prototype for Zimran Business Cup 2.0 · all data stays in this browser (localStorage)","Прототип для Zimran Business Cup 2.0 · все данные хранятся только в этом браузере (localStorage)")+' · <a href="#/about">'+BF.L("About Balapan","О Balapan")+'</a> · <button class="linkbtn" id="resetAll">'+BF.L("Reset all data","Сбросить все данные")+'</button></p>';
    bind(); applySettings();
    var r = BF.router.current && BF.router.current(); if(r){ var nav = document.querySelector('[data-nav="'+r.name+'"]'); }
  };
  function applySettings(){
    var s = f().settings;
    html.classList.toggle("calm", !!s.calm);
    html.classList.toggle("dark", s.theme==="dark");
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content", s.theme==="dark" ? "#141c2e" : "#F3EBDD");
  }
  BF.applySettings = applySettings;
  function bind(){
    var s = f().settings;
    document.querySelectorAll(".langsw [data-lang]").forEach(function(b){ b.onclick = function(){ BF.setLang(b.getAttribute("data-lang")); BF.renderShell(); BF.router.refresh(); }; });
    document.getElementById("themeToggle").onclick = function(){ BF.store.updateFamily(function(x){ x.settings.theme = x.settings.theme==="dark" ? "light" : "dark"; }); BF.renderShell(); };
    document.getElementById("calmToggle").onclick = function(){ BF.store.updateFamily(function(x){ x.settings.calm = !x.settings.calm; }); BF.renderShell(); BF.ui.toast(f().settings.calm ? BF.L("Calm mode on: less motion, no sounds.","Спокойный режим включён: меньше движения, без звуков.") : BF.L("Calm mode off.","Спокойный режим выключен.")); };
    document.getElementById("soundToggle").onclick = function(){
      if(f().settings.calm){ BF.ui.toast(BF.L("Sound stays off in Calm mode.","В спокойном режиме звук выключен.")); return; }
      BF.store.updateFamily(function(x){ x.settings.sound = !x.settings.sound; }); BF.sound.unlock(); BF.renderShell(); BF.sound.chime();
    };
    document.getElementById("kidSwitch").onclick = openSwitcher;
    document.getElementById("resetAll").onclick = function(){ if(confirm(BF.L("Remove all children, plans, diary and progress from this browser?","Удалить всех детей, планы, дневник и прогресс из этого браузера?"))){ BF.store.reset(); location.hash = "#/"; location.reload(); } };
  }
  function openSwitcher(){
    var st = BF.store, kids = st.children(), cur = st.f.active;
    var sh = BF.ui.sheet('<h2>'+BF.L("Whose plan are we looking at?","Чей план открываем?")+'</h2><div class="kid-list">'+kids.map(function(c){
      return '<button class="kid-row'+(c.id===cur?' on':'')+'" data-id="'+c.id+'">'+BF.avatar.svg(c.avatar,{size:52, headOnly:true})+'<span><b>'+esc(BF.ui.heroName(c))+'</b><small>'+(c.quizDone ? BF.L("age","возраст")+' '+c.age+' · '+BF.ui.T(BF.TAGS[c.profile]?BF.TAGS[c.profile].label:{en:"profile not set",ru:"профиль не задан"}) : BF.L("quiz not finished","квиз не пройден"))+'</small></span>'+(c.isDemo?'<span class="demo-tag">'+BF.L("demo data","демо-данные")+'</span>':'')+'</button>';
    }).join("")+'</div><div class="cel-actions"><button class="btn clay" id="ksAdd">'+I("plus",18)+' '+BF.L("Add a child","Добавить ребёнка")+'</button><a class="btn ghost" href="#/family">'+BF.L("Manage children","Управление детьми")+'</a></div><p class="fine">'+BF.L("Free: 1 child · Monthly: 2 children · Yearly: up to 3 children.","Бесплатно: 1 ребёнок · Месяц: 2 ребёнка · Год: до 3 детей.")+'</p>', "narrow");
    sh.querySelectorAll(".kid-row").forEach(function(b){ b.onclick = function(){ st.setActive(b.getAttribute("data-id")); sh.close(); BF.renderShell(); BF.router.go("/"); BF.router.refresh(); }; });
    sh.querySelector("#ksAdd").onclick = function(){ sh.close(); BF.addChildFlow(); };
    sh.querySelector('a[href="#/family"]').onclick = function(){ sh.close(); };
  }
  BF.addChildFlow = function(){

    if(!st.canAddChild()){ BF.router.go("/pricing?children=1"); BF.ui.toast(BF.L("Your plan allows "+st.childLimit()+" child(ren). Upgrade to add another.","Ваш тариф позволяет детей: "+st.childLimit()+". Чтобы добавить ещё, смените тариф.")); return; }

  };
  // Skip link: move focus to the content without touching the hash router ("#app" is not a route).
  document.getElementById("skipLink").addEventListener("click", function(e){ e.preventDefault(); var m = document.getElementById("app"); m.focus(); m.scrollIntoView(); });

})();
